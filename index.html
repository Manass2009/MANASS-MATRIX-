<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>MANASSÉ MATRIX — HOLOGRAM</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#020408;

    font-family:Arial,sans-serif;

}

body{

    position:fixed;
    inset:0;

}


/* =====================================================
   MONDE HOLOGRAPHIQUE
   ===================================================== */

#hologram{

    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;
    height:100dvh;

    overflow:hidden;

    background:

        radial-gradient(
            ellipse at center,
            rgba(0,70,100,.30) 0%,
            rgba(0,20,35,.18) 35%,
            rgba(2,4,8,1) 78%
        );

}


/* =====================================================
   CANVAS 3D
   ===================================================== */

#canvas{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:1;

}


/* =====================================================
   GRILLE HOLOGRAPHIQUE
   ===================================================== */

#grid{

    position:absolute;

    inset:0;

    z-index:2;

    pointer-events:none;

    background:

        linear-gradient(
            rgba(0,240,255,.025) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,240,255,.025) 1px,
            transparent 1px
        );

    background-size:35px 35px;

    opacity:.45;

}


/* =====================================================
   VIGNETTE
   ===================================================== */

#vignette{

    position:absolute;

    inset:0;

    z-index:3;

    pointer-events:none;

    background:

        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,.35) 100%
        );

}


/* =====================================================
   TITRE DISCRET
   ===================================================== */

#systemName{

    position:absolute;

    top:20px;
    left:50%;

    transform:translateX(-50%);

    z-index:10;

    color:#00f0ff;

    font-size:11px;

    letter-spacing:4px;

    white-space:nowrap;

    text-shadow:
        0 0 5px #00f0ff,
        0 0 15px #00f0ff;

    opacity:.75;

}


/* =====================================================
   ÉTAT SYSTÈME
   ===================================================== */

#status{

    position:absolute;

    bottom:25px;
    left:50%;

    transform:translateX(-50%);

    z-index:10;

    color:#00f0ff;

    font-size:10px;

    letter-spacing:2px;

    text-align:center;

    white-space:nowrap;

    text-shadow:
        0 0 8px #00f0ff;

}


/* =====================================================
   INDICATEUR MICRO
   ===================================================== */

#micro{

    position:absolute;

    bottom:50px;
    left:50%;

    transform:translateX(-50%);

    width:8px;
    height:8px;

    border-radius:50%;

    background:#00f0ff;

    box-shadow:
        0 0 8px #00f0ff,
        0 0 20px #00f0ff;

    z-index:10;

    opacity:.3;

}


/* MICRO ACTIF */

#micro.active{

    opacity:1;

    animation:
        microphonePulse .8s infinite alternate;

}


@keyframes microphonePulse{

    from{

        transform:
            translateX(-50%)
            scale(1);

        box-shadow:
            0 0 8px #00f0ff,
            0 0 20px #00f0ff;

    }

    to{

        transform:
            translateX(-50%)
            scale(2);

        box-shadow:
            0 0 15px #00f0ff,
            0 0 40px #00f0ff;

    }

}


/* =====================================================
   ÉCRAN DE DÉMARRAGE MINIMAL
   ===================================================== */

#start{

    position:absolute;

    inset:0;

    z-index:100;

    display:flex;

    align-items:center;

    justify-content:center;

    background:
        radial-gradient(
            circle,
            rgba(0,30,45,.98),
            #020408
        );

}


#startButton{

    padding:18px 30px;

    border:1px solid #00f0ff;

    border-radius:50px;

    background:rgba(0,240,255,.08);

    color:#00f0ff;

    font-size:13px;

    font-weight:bold;

    letter-spacing:3px;

    box-shadow:
        0 0 20px rgba(0,240,255,.35);

    cursor:pointer;

}


/* =====================================================
   MASQUER LE DÉMARRAGE
   ===================================================== */

#start.hidden{

    display:none;

}

</style>

</head>


<body>


<div id="hologram">


    <canvas id="canvas"></canvas>


    <div id="grid"></div>

    <div id="vignette"></div>


    <div id="systemName">
        MANASSÉ MATRIX
    </div>


    <div id="status">
        INITIALISATION...
    </div>


    <div id="micro"></div>


    <div id="start">

        <button id="startButton">
            ACTIVER L'HOLOGRAMME
        </button>

    </div>


</div>



<script>

/* =====================================================
   CONFIGURATION
   ===================================================== */

const AVATAR =
    "./Modèle 3D d'IA féminine futuriste.glb.txt";


const GROQ_URL =
    "https://api.groq.com/openai/v1/chat/completions";


const GROQ_MODEL =
    "openai/gpt-oss-120b";


/* =====================================================
   VARIABLES
   ===================================================== */

let scene;

let camera;

let renderer;

let avatar = null;

let clock;

let recognition = null;

let listening = false;

let speaking = false;

let audioContext = null;

let audioAnalyser = null;

let audioSource = null;

let audioData = null;

let currentAudio = null;


/* =====================================================
   ÉLÉMENTS
   ===================================================== */

const canvas =
    document.getElementById("canvas");

const status =
    document.getElementById("status");

const micro =
    document.getElementById("micro");

const start =
    document.getElementById("start");

const startButton =
    document.getElementById("startButton");


/* =====================================================
   MÉMOIRE IA
   ===================================================== */

let memory = [

    {
        role:"system",

        content:`

Tu es MANASSÉ MATRIX.

Tu es une intelligence artificielle personnelle
holographique futuriste.

Tu parles naturellement en français.

Tu dois comprendre les questions de l'utilisateur,
raisonner, expliquer, aider et tenir compte du contexte
de la conversation.

Tes réponses vocales doivent être naturelles,
claires et relativement courtes.

Tu ne dois jamais dire que tu es un simple chatbot.

Tu es l'assistante holographique de Manassé.

`

    }

];


/* =====================================================
   INITIALISATION THREE.JS
   ===================================================== */

function init3D(){

    scene =
        new THREE.Scene();


    camera =
        new THREE.PerspectiveCamera(

            35,

            window.innerWidth /
            window.innerHeight,

            .01,

            1000

        );


    camera.position.set(

        0,
        1.25,
        3.2

    );


    renderer =
        new THREE.WebGLRenderer({

            canvas:canvas,

            antialias:true,

            alpha:true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,
        window.innerHeight

    );


    renderer.outputEncoding =
        THREE.sRGBEncoding;


    /* =================================================
       LUMIÈRES
       ================================================= */

    const ambient =
        new THREE.AmbientLight(

            0xffffff,
            2.5

        );


    scene.add(ambient);


    const cyan =
        new THREE.PointLight(

            0x00ffff,
            8,
            20

        );


    cyan.position.set(
        0,
        2,
        4
    );


    scene.add(cyan);


    const blue =
        new THREE.PointLight(

            0x0077ff,
            5,
            20

        );


    blue.position.set(
        -3,
        1,
        2
    );


    scene.add(blue);


    const back =
        new THREE.PointLight(

            0x00ffff,
            6,
            20

        );


    back.position.set(
        0,
        2,
        -3
    );


    scene.add(back);


    clock =
        new THREE.Clock();


    chargerAvatar();

}


/* =====================================================
   CHARGEMENT AVATAR
   ===================================================== */

async function chargerAvatar(){

    status.innerText =
        "CHARGEMENT DU NOYAU HOLOGRAPHIQUE";


    try{

        const response =
            await fetch(AVATAR);


        if(!response.ok){

            throw new Error(
                "Avatar introuvable"
            );

        }


        const buffer =
            await response.arrayBuffer();


        const loader =
            new THREE.GLTFLoader();


        loader.parse(

            buffer,

            "",

            function(gltf){

                avatar =
                    gltf.scene;


                preparerAvatar();


                scene.add(
                    avatar
                );


                status.innerText =
                    "HOLOGRAMME ACTIF • JE VOUS ÉCOUTE";


                demarrerEcoute();

            },

            function(error){

                console.error(
                    error
                );

                status.innerText =
                    "ERREUR DE CHARGEMENT DE L'AVATAR";

            }

        );

    }
    catch(error){

        console.error(
            error
        );

        status.innerText =
            "AVATAR INTROUVABLE";

    }

}


/* =====================================================
   PRÉPARER AVATAR
   ===================================================== */

function preparerAvatar(){

    const box =
        new THREE.Box3()
        .setFromObject(avatar);


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    const center =
        box.getCenter(
            new THREE.Vector3()
        );


    avatar.position.x -=
        center.x;


    avatar.position.z -=
        center.z;


    const max =
        Math.max(

            size.x,
            size.y,
            size.z

        );


    if(max > 0){

        const scale =
            2.7 / max;


        avatar.scale.setScalar(
            scale
        );

    }


    avatar.position.y =
        -1.25;


    /* ================================================
       APPARENCE HOLOGRAPHIQUE
       ================================================ */

    avatar.traverse(
        object => {

            if(
                object.isMesh
            ){

                object.frustumCulled =
                    false;


                if(
                    object.material
                ){

                    object.material.transparent =
                        true;


                    object.material.opacity =
                        .94;

                }

            }

        }
    );

}


/* =====================================================
   ANIMATION AVATAR
   ===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const time =
        clock.getElapsedTime();


    if(avatar){

        /*
         Respiration normale
        */

        avatar.position.y =
            -1.25 +
            Math.sin(time * 1.5)
            * .015;


        /*
         Mouvement naturel
        */

        avatar.rotation.y =
            Math.sin(time * .35)
            * .06;


        /*
         IA EN TRAIN DE PARLER
        */

        if(speaking){

            const intensity =
                audioData
                ? getAudioLevel()
                : .04;


            avatar.position.y =
                -1.25 +
                Math.sin(time * 7)
                * (.025 + intensity*.08);


            avatar.rotation.y =
                Math.sin(time * 2)
                * (.08 + intensity*.12);


            avatar.rotation.z =
                Math.sin(time * 3)
                * .025;


            /*
             Effet holographique
            */

            const pulse =
                0.90 +
                intensity*.3;


            avatar.scale.setScalar(
                pulse *
                getBaseScale()
            );

        }

    }


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   ÉCHELLE AVATAR
   ===================================================== */

let baseScale = 1;


function getBaseScale(){

    return baseScale;

}


/* =====================================================
   MICROPHONE
   ===================================================== */

function initialiserMicro(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        status.innerText =
            "RECONNAISSANCE VOCALE NON DISPONIBLE";

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "fr-FR";


    recognition.continuous =
        true;


    recognition.interimResults =
        false;


    recognition.maxAlternatives =
        1;


    recognition.onstart =
        function(){

            listening = true;

            micro.classList.add(
                "active"
            );

            status.innerText =
                "JE VOUS ÉCOUTE...";

        };


    recognition.onresult =
        function(event){

            const result =
                event.results[
                    event.results.length - 1
                ];


            if(!result.isFinal)
                return;


            const text =
                result[0]
                .transcript
                .trim();


            if(text){

                traiterQuestion(
                    text
                );

            }

        };


    recognition.onerror =
        function(event){

            console.log(
                "Micro:",
                event.error
            );


            listening =
                false;


            micro.classList.remove(
                "active"
            );


            /*
             On relance automatiquement
             sauf erreur de permission.
            */

            if(
                event.error !==
                "not-allowed"
            ){

                setTimeout(
                    demarrerEcoute,
                    1000
                );

            }

        };


    recognition.onend =
        function(){

            listening =
                false;


            micro.classList.remove(
                "active"
            );


            /*
             L'hologramme reste
             en écoute.
            */

            setTimeout(
                demarrerEcoute,
                500
            );

        };

}


/* =====================================================
   DÉMARRER ÉCOUTE
   ===================================================== */

function demarrerEcoute(){

    if(!recognition)
        return;


    if(listening)
        return;


    try{

        recognition.start();

    }
    catch(error){

        console.log(error);

    }

}


/* =====================================================
   QUESTION → GROQ
   ===================================================== */

async function traiterQuestion(
    question
){

    status.innerText =
        "ANALYSE NEURALE...";


    memory.push({

        role:"user",

        content:question

    });


    /*
     Maximum de mémoire pour éviter
     une requête énorme.
    */

    if(memory.length > 21){

        memory =
            [
                memory[0],
                ...memory.slice(
                    -20
                )
            ];

    }


    try{

        const key =
            obtenirCle();


        if(!key){

            status.innerText =
                "CLÉ GROQ MANQUANTE";

            return;

        }


        const response =
            await fetch(

                GROQ_URL,

                {

                    method:"POST",

                    headers:{

                        "Authorization":
                            "Bearer " + key,

                        "Content-Type":
                            "application/json"

                    },

                    body:
                    JSON.stringify({

                        model:
                            GROQ_MODEL,

                        messages:
                            memory,

                        temperature:
                            .7,

                        max_tokens:
                            500

                    })

                }

            );


        const data =
            await response.json();


        if(
            data.error
        ){

            throw new Error(
                data.error.message
            );

        }


        const answer =
            data.choices[0]
            .message
            .content;


        memory.push({

            role:"assistant",

            content:answer

        });


        status.innerText =
            "MANASSÉ MATRIX • RÉPONSE";


        parler(answer);

    }
    catch(error){

        console.error(
            error
        );


        status.innerText =
            "ERREUR DE CONNEXION GROQ";

    }

}


/* =====================================================
   CLÉ GROQ
   ===================================================== */

function obtenirCle(){

    let key =
        localStorage.getItem(
            "manasse_groq_key"
        );


    if(!key){

        key =
            prompt(
                "Entrez votre clé API Groq :"
            );


        if(key){

            key =
                key.trim();


            localStorage.setItem(
                "manasse_groq_key",
                key
            );

        }

    }


    return key;

}


/* =====================================================
   SYNTHÈSE VOCALE
   ===================================================== */

function parler(
    text
){

    /*
     Arrêter l'écoute pendant
     que l'IA parle pour éviter
     qu'elle entende sa propre voix.
    */

    if(
        recognition &&
        listening
    ){

        try{

            recognition.stop();

        }
        catch(e){}

    }


    if(
        !("speechSynthesis"
        in window)
    ){

        demarrerEcoute();

        return;

    }


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.lang =
        "fr-FR";


    utterance.rate =
        .95;


    utterance.pitch =
        .85;


    const voices =
        speechSynthesis
        .getVoices();


    const frenchVoice =
        voices.find(

            voice =>
            voice.lang
            &&
            voice.lang
                .toLowerCase()
                .startsWith("fr")

        );


    if(frenchVoice){

        utterance.voice =
            frenchVoice;

    }


    utterance.onstart =
        function(){

            speaking =
                true;

            status.innerText =
                "MANASSÉ MATRIX • RÉPONSE EN COURS";

        };


    utterance.onend =
        function(){

            speaking =
                false;


            status.innerText =
                "JE VOUS ÉCOUTE...";


            demarrerEcoute();

        };


    utterance.onerror =
        function(){

            speaking =
                false;


            demarrerEcoute();

        };


    speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   AUDIO ANALYSER
   ===================================================== */

function getAudioLevel(){

    if(
        !audioAnalyser ||
        !audioData
    ){

        return .05;

    }


    audioAnalyser.getByteFrequencyData(
        audioData
    );


    let total = 0;


    for(
        let i=0;
        i<audioData.length;
        i++
    ){

        total +=
            audioData[i];

    }


    return Math.min(
        total /
        audioData.length /
        255,
        1
    );

}


/* =====================================================
   REDIMENSIONNEMENT
   ===================================================== */

window.addEventListener(
"resize",
function(){

    if(!camera || !renderer)
        return;


    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,
        window.innerHeight

    );

});


/* =====================================================
   ACTIVATION
   ===================================================== */

startButton.addEventListener(
"click",
async function(){

    /*
     Activation du microphone
     après interaction utilisateur.
    */

    try{

        await navigator.mediaDevices
            .getUserMedia({
                audio:true
            });

    }
    catch(error){

        status.innerText =
            "MICROPHONE REFUSÉ";

        console.error(
            error
        );

    }


    /*
     Initialisation du système.
    */

    initialiserMicro();


    init3D();


    animate();


    start.classList.add(
        "hidden"
    );


    /*
     Plein écran du téléphone.
    */

    if(
        document.documentElement
        .requestFullscreen
    ){

        try{

            await document
                .documentElement
                .requestFullscreen();

        }
        catch(e){}

    }

});


/* =====================================================
   VOIX DISPONIBLES
   ===================================================== */

if(
    "speechSynthesis"
    in window
){

    speechSynthesis
        .getVoices();

}

</script>

</body>
</html>
