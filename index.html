<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,
initial-scale=1.0,
maximum-scale=1.0,
user-scalable=no">

<title>MANASSÉ MATRIX — HOLOGRAM AI</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,
body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:#020408;

    font-family:Arial,sans-serif;

}

body{

    position:fixed;
    inset:0;

}

#app{

    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;
    height:100dvh;

    overflow:hidden;

    background:
    radial-gradient(
        ellipse at center,
        rgba(0,70,100,.35),
        rgba(2,4,8,1) 75%
    );

}


/* =====================================================
   CAMÉRA
   ===================================================== */

#camera{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    transform:scaleX(-1);

    opacity:.16;

    filter:
    brightness(.65)
    contrast(1.15)
    saturate(.5);

    z-index:0;

}


/* =====================================================
   VOILE HOLOGRAPHIQUE
   ===================================================== */

#cameraOverlay{

    position:absolute;

    inset:0;

    z-index:1;

    pointer-events:none;

    background:

    radial-gradient(
        ellipse at center,
        rgba(0,240,255,.05),
        rgba(0,0,0,.72) 85%
    );

}


/* =====================================================
   THREE.JS
   ===================================================== */

#canvas{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    z-index:2;

}


/* =====================================================
   GRILLE
   ===================================================== */

#grid{

    position:absolute;

    inset:0;

    z-index:3;

    pointer-events:none;

    background:

    linear-gradient(
        rgba(0,240,255,.025) 1px,
        transparent 1px
    ),

    linear-gradient(
        90deg,
        rgba(0,240,255,.025) 1px,
        transparent 1px
    );

    background-size:30px 30px;

}


/* =====================================================
   HUD
   ===================================================== */

#title{

    position:absolute;

    top:20px;

    left:50%;

    transform:translateX(-50%);

    z-index:20;

    color:#00f0ff;

    font-size:10px;

    letter-spacing:4px;

    white-space:nowrap;

    text-shadow:
    0 0 8px #00f0ff,
    0 0 20px #00f0ff;

}


#status{

    position:absolute;

    bottom:28px;

    left:50%;

    transform:translateX(-50%);

    z-index:20;

    color:#00f0ff;

    font-size:10px;

    letter-spacing:2px;

    white-space:nowrap;

    text-shadow:
    0 0 8px #00f0ff;

}


#microIndicator{

    position:absolute;

    bottom:52px;

    left:50%;

    transform:translateX(-50%);

    width:8px;

    height:8px;

    border-radius:50%;

    background:#00f0ff;

    opacity:.35;

    z-index:20;

    box-shadow:
    0 0 8px #00f0ff;

}


#microIndicator.active{

    opacity:1;

    animation:micPulse .7s infinite alternate;

}


@keyframes micPulse{

    from{

        transform:
        translateX(-50%)
        scale(1);

    }

    to{

        transform:
        translateX(-50%)
        scale(2);

    }

}


/* =====================================================
   CAMÉRA HUD
   ===================================================== */

#vision{

    position:absolute;

    top:65px;

    right:15px;

    z-index:20;

    padding:7px 10px;

    border:1px solid rgba(0,240,255,.35);

    border-radius:8px;

    background:rgba(0,10,20,.5);

    color:#00f0ff;

    font-size:8px;

    letter-spacing:1px;

}


/* =====================================================
   DÉMARRAGE
   ===================================================== */

#startScreen{

    position:absolute;

    inset:0;

    z-index:100;

    display:flex;

    justify-content:center;

    align-items:center;

    background:
    radial-gradient(
        circle,
        rgba(0,30,45,.98),
        #020408
    );

}


#startButton{

    padding:18px 30px;

    border-radius:50px;

    border:1px solid #00f0ff;

    background:rgba(0,240,255,.08);

    color:#00f0ff;

    font-weight:bold;

    font-size:12px;

    letter-spacing:3px;

    box-shadow:
    0 0 25px rgba(0,240,255,.35);

}


#startScreen.hidden{

    display:none;

}


/* =====================================================
   ERREUR
   ===================================================== */

#error{

    position:absolute;

    left:50%;

    top:50%;

    transform:translate(-50%,-50%);

    z-index:200;

    color:#00f0ff;

    font-size:11px;

    text-align:center;

    max-width:80%;

    display:none;

}

</style>

</head>


<body>


<div id="app">


    <!-- CAMÉRA FRONTALE -->

    <video
        id="camera"
        autoplay
        playsinline
        muted>
    </video>


    <div id="cameraOverlay"></div>


    <canvas id="canvas"></canvas>


    <div id="grid"></div>


    <div id="title">
        MANASSÉ MATRIX
    </div>


    <div id="vision">
        👁 VISION ACTIVE
    </div>


    <div id="microIndicator"></div>


    <div id="status">
        INITIALISATION...
    </div>


    <div id="error"></div>


    <div id="startScreen">

        <button id="startButton">
            ACTIVER MANASSÉ MATRIX
        </button>

    </div>


</div>



<script>

/* =====================================================
   CONFIGURATION
   ===================================================== */

const AVATAR_FILE =
"./Modèle 3D d'IA féminine futuriste.glb.txt";


const GROQ_ENDPOINT =
"https://api.groq.com/openai/v1/chat/completions";


/*
   Modèle Groq avec vision.
*/

const GROQ_MODEL =
"qwen/qwen3.6-27b";


/* =====================================================
   ÉLÉMENTS
   ===================================================== */

const video =
document.getElementById("camera");

const canvas =
document.getElementById("canvas");

const startScreen =
document.getElementById("startScreen");

const startButton =
document.getElementById("startButton");

const status =
document.getElementById("status");

const microIndicator =
document.getElementById("microIndicator");

const vision =
document.getElementById("vision");

const errorBox =
document.getElementById("error");


/* =====================================================
   VARIABLES
   ===================================================== */

let scene;

let camera;

let renderer;

let avatar;

let clock;

let recognition;

let mediaStream;

let listening=false;

let speaking=false;

let processing=false;

let visionCanvas;

let lastVisionTime=0;


/* =====================================================
   MÉMOIRE
   ===================================================== */

let memory=[

{

role:"system",

content:`

Tu es MANASSÉ MATRIX.

Tu es une intelligence artificielle holographique
personnelle, intelligente et futuriste.

Tu communiques naturellement en français.

Tu peux comprendre ce que l'utilisateur dit
et analyser ce que la caméra montre.

Tu dois répondre comme une véritable assistante
personnelle.

Tu dois être précise, intelligente, naturelle
et utile.

Ne parle pas de programmation interne.

Lorsque tu vois l'utilisateur à travers la caméra,
tu peux décrire uniquement ce qui est réellement
visible.

Ne prétends jamais voir quelque chose qui n'est
pas visible.

Réponds de manière concise lorsque la réponse
est destinée à être prononcée à voix haute.

`

}

];


/* =====================================================
   CLÉ GROQ
   ===================================================== */

function getGroqKey(){

    let key=
    localStorage.getItem(
        "manasse_groq_key"
    );


    if(!key){

        key=prompt(
            "Entrez votre clé API Groq :"
        );


        if(key){

            key=key.trim();

            localStorage.setItem(
                "manasse_groq_key",
                key
            );

        }

    }


    return key;

}


/* =====================================================
   CAMÉRA + MICRO
   ===================================================== */

async function activateMedia(){

    status.innerText=
    "ACTIVATION DU MICROPHONE ET DE LA CAMÉRA...";


    try{

        mediaStream=
        await navigator.mediaDevices.getUserMedia({

            audio:{
                echoCancellation:true,
                noiseSuppression:true,
                autoGainControl:true
            },

            video:{
                facingMode:{
                    ideal:"user"
                },

                width:{
                    ideal:1280
                },

                height:{
                    ideal:720
                }
            }

        });


        video.srcObject=
        mediaStream;


        await video.play();


        vision.innerText=
        "👁 VISION ACTIVE • CAMÉRA FRONTALE";


        status.innerText=
        "CAMÉRA + MICRO ACTIVÉS";


        return true;

    }
    catch(error){

        console.error(
            "MEDIA ERROR:",
            error
        );


        showError(

        "Impossible d'accéder à la caméra ou au microphone. Autorise les deux dans ton navigateur."

        );


        return false;

    }

}


/* =====================================================
   RECONNAISSANCE VOCALE
   ===================================================== */

function initSpeechRecognition(){

    const SpeechRecognition=
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        showError(

        "La reconnaissance vocale n'est pas disponible dans ce navigateur. Utilise Chrome."

        );

        return false;

    }


    recognition=
    new SpeechRecognition();


    recognition.lang=
    "fr-FR";


    recognition.continuous=
    true;


    recognition.interimResults=
    false;


    recognition.maxAlternatives=
    1;


    recognition.onstart=()=>{

        listening=true;

        microIndicator.classList.add(
            "active"
        );

        status.innerText=
        "JE VOUS ÉCOUTE...";

    };


    recognition.onresult=
    async(event)=>{

        const result=
        event.results[
            event.results.length-1
        ];


        if(!result.isFinal)
        return;


        const text=
        result[0]
        .transcript
        .trim();


        if(!text)
        return;


        console.log(
            "Utilisateur:",
            text
        );


        await askAI(text);

    };


    recognition.onerror=
    event=>{

        console.log(
            "Speech error:",
            event.error
        );


        listening=false;

        microIndicator.classList.remove(
            "active"
        );


        if(
            event.error==="not-allowed" ||
            event.error==="service-not-allowed"
        ){

            showError(

            "Le microphone a été refusé. Autorise le microphone puis recharge la page."

            );

            return;

        }


        setTimeout(
            startListening,
            800
        );

    };


    recognition.onend=()=>{

        listening=false;

        microIndicator.classList.remove(
            "active"
        );


        if(
            !speaking &&
            !processing
        ){

            setTimeout(
                startListening,
                500
            );

        }

    };


    return true;

}


/* =====================================================
   ÉCOUTER
   ===================================================== */

function startListening(){

    if(
        !recognition ||
        listening ||
        speaking ||
        processing
    )
    return;


    try{

        recognition.start();

    }
    catch(error){

        console.log(
            error
        );

    }

}


/* =====================================================
   CAPTURE DE LA CAMÉRA
   ===================================================== */

function captureCameraImage(){

    if(
        !video.videoWidth ||
        !video.videoHeight
    ){

        return null;

    }


    if(!visionCanvas){

        visionCanvas=
        document.createElement(
            "canvas"
        );

    }


    /*
       Résolution raisonnable pour
       éviter une requête énorme.
    */

    const width=640;

    const height=
    Math.round(
        video.videoHeight /
        video.videoWidth *
        width
    );


    visionCanvas.width=
    width;

    visionCanvas.height=
    height;


    const ctx=
    visionCanvas.getContext(
        "2d"
    );


    /*
       Comme la vidéo est miroir
       à l'écran, on capture aussi
       une image normale.
    */

    ctx.save();

    ctx.translate(
        width,
        0
    );

    ctx.scale(
        -1,
        1
    );


    ctx.drawImage(
        video,
        0,
        0,
        width,
        height
    );


    ctx.restore();


    return visionCanvas.toDataURL(
        "image/jpeg",
        .65
    );

}


/* =====================================================
   ENVOYER QUESTION À GROQ
   ===================================================== */

async function askAI(question){

    if(processing)
    return;


    processing=true;


    if(
        recognition &&
        listening
    ){

        try{
            recognition.stop();
        }
        catch(e){}

    }


    status.innerText=
    "ANALYSE NEURALE + VISION...";


    const apiKey=
    getGroqKey();


    if(!apiKey){

        processing=false;

        status.innerText=
        "CLÉ GROQ REQUISE";

        startListening();

        return;

    }


    /*
       Capture de ce que voit
       la caméra.
    */

    const image=
    captureCameraImage();


    /*
       Mémoire textuelle.
    */

    memory.push({

        role:"user",

        content:question

    });


    if(
        memory.length>15
    ){

        memory=[
            memory[0],
            ...memory.slice(-14)
        ];

    }


    /*
       Messages envoyés à Groq.
    */

    const messages=[
        ...memory.slice(
            0,
            -1
        )
    ];


    /*
       La question + image caméra.
    */

    const userContent=[

        {
            type:"text",

            text:

            `L'utilisateur dit :

"${question}"

Analyse aussi l'image de la caméra si elle est fournie.
Réponds directement à l'utilisateur en français.`

        }

    ];


    if(image){

        userContent.push({

            type:"image_url",

            image_url:{

                url:image

            }

        });

    }


    messages.push({

        role:"user",

        content:userContent

    });


    try{

        const response=
        await fetch(
            GROQ_ENDPOINT,
            {

                method:"POST",

                headers:{

                    "Authorization":
                    "Bearer "+apiKey,

                    "Content-Type":
                    "application/json"

                },

                body:JSON.stringify({

                    model:GROQ_MODEL,

                    messages:messages,

                    temperature:.6,

                    max_completion_tokens:500

                })

            }

        );


        const data=
        await response.json();


        if(
            !response.ok ||
            data.error
        ){

            throw new Error(

                data.error
                ? data.error.message
                : "Erreur Groq"

            );

        }


        const answer=
        data.choices[0]
        .message
        .content
        .trim();


        memory.push({

            role:"assistant",

            content:answer

        });


        status.innerText=
        "RÉPONSE DE MANASSÉ MATRIX";


        speak(answer);

    }
    catch(error){

        console.error(
            error
        );


        status.innerText=
        "ERREUR DE CONNEXION GROQ";


        /*
           On permet de réécouter
           même après une erreur.
        */

        setTimeout(
            startListening,
            1000
        );

    }


    processing=false;

}


/* =====================================================
   PAROLE
   ===================================================== */

function speak(text){

    if(
        !("speechSynthesis"
        in window)
    ){

        speaking=false;

        startListening();

        return;

    }


    speechSynthesis.cancel();


    const utterance=
    new SpeechSynthesisUtterance(
        text
    );


    utterance.lang=
    "fr-FR";


    utterance.rate=
    .95;


    utterance.pitch=
    .82;


    const voices=
    speechSynthesis
    .getVoices();


    const french=
    voices.find(
        voice=>
        voice.lang &&
        voice.lang
        .toLowerCase()
        .startsWith("fr")
    );


    if(french){

        utterance.voice=
        french;

    }


    utterance.onstart=()=>{

        speaking=true;

        status.innerText=
        "MANASSÉ MATRIX PARLE...";

    };


    utterance.onend=()=>{

        speaking=false;

        status.innerText=
        "JE VOUS ÉCOUTE...";


        setTimeout(
            startListening,
            300
        );

    };


    utterance.onerror=()=>{

        speaking=false;

        setTimeout(
            startListening,
            500
        );

    };


    speechSynthesis.speak(
        utterance
    );

}


/* =====================================================
   THREE.JS
   ===================================================== */

function init3D(){

    scene=
    new THREE.Scene();


    camera=
    new THREE.PerspectiveCamera(

        35,

        window.innerWidth/
        window.innerHeight,

        .01,

        1000

    );


    camera.position.set(

        0,
        1.25,
        3.2

    );


    renderer=
    new THREE.WebGLRenderer({

        canvas:canvas,

        alpha:true,

        antialias:true,

        powerPreference:
        "high-performance"

    });


    renderer.setPixelRatio(

        Math.min(
            window.devicePixelRatio,
            2
        )

    );


    renderer.setSize(

        window.innerWidth,
        window.innerHeight

    );


    renderer.outputEncoding=
    THREE.sRGBEncoding;


    /*
       Lumière générale.
    */

    scene.add(
        new THREE.AmbientLight(
            0xffffff,
            2.2
        )
    );


    const cyan=
    new THREE.PointLight(
        0x00ffff,
        8,
        20
    );


    cyan.position.set(
        0,
        3,
        4
    );


    scene.add(cyan);


    const blue=
    new THREE.PointLight(
        0x0077ff,
        6,
        20
    );


    blue.position.set(
        -3,
        1,
        2
    );


    scene.add(blue);


    const back=
    new THREE.PointLight(
        0x00ffff,
        7,
        20
    );


    back.position.set(
        0,
        2,
        -3
    );


    scene.add(back);


    clock=
    new THREE.Clock();


    loadAvatar();

}


/* =====================================================
   AVATAR
   ===================================================== */

function loadAvatar(){

    status.innerText=
    "CHARGEMENT DE L'AVATAR...";


    const loader=
    new THREE.GLTFLoader();


    /*
       NOM EXACT DU FICHIER.
    */

    loader.load(

        AVATAR_FILE,

        gltf=>{

            avatar=
            gltf.scene;


            prepareAvatar();


            scene.add(
                avatar
            );


            status.innerText=
            "HOLOGRAMME ACTIF • JE VOUS ÉCOUTE";


            startListening();

        },

        undefined,

        error=>{

            console.error(
                error
            );


            status.innerText=
            "ERREUR AVATAR 3D";


            showError(

            "Le modèle 3D n'a pas pu être chargé. Vérifie que le fichier est exactement : Modèle 3D d'IA féminine futuriste.glb.txt"

            );

        }

    );

}


/* =====================================================
   PRÉPARER AVATAR
   ===================================================== */

function prepareAvatar(){

    const box=
    new THREE.Box3()
    .setFromObject(
        avatar
    );


    const size=
    box.getSize(
        new THREE.Vector3()
    );


    const center=
    box.getCenter(
        new THREE.Vector3()
    );


    avatar.position.x-=
    center.x;


    avatar.position.z-=
    center.z;


    const max=
    Math.max(
        size.x,
        size.y,
        size.z
    );


    if(max>0){

        const scale=
        2.7/max;


        avatar.scale.setScalar(
            scale
        );

    }


    avatar.position.y=
    -1.25;


    /*
       Matériaux holographiques.
    */

    avatar.traverse(
        object=>{

            if(
                object.isMesh
            ){

                object.frustumCulled=
                false;


                if(
                    object.material
                ){

                    object.material.transparent=
                    true;


                    object.material.opacity=
                    .95;

                }

            }

        }
    );

}


/* =====================================================
   ANIMATION
   ===================================================== */

function animate(){

    requestAnimationFrame(
        animate
    );


    const time=
    clock.getElapsedTime();


    if(avatar){

        /*
           Respiration.
        */

        avatar.position.y=
        -1.25+
        Math.sin(
            time*1.5
        )*.018;


        /*
           Mouvement naturel.
        */

        avatar.rotation.y=
        Math.sin(
            time*.4
        )*.06;


        /*
           Mouvement pendant
           la parole.
        */

        if(speaking){

            avatar.position.y=
            -1.25+
            Math.sin(
                time*6
            )*.035;


            avatar.rotation.y=
            Math.sin(
                time*2
            )*.12;


            avatar.rotation.z=
            Math.sin(
                time*3
            )*.02;

        }

    }


    renderer.render(
        scene,
        camera
    );

}


/* =====================================================
   ERREUR
   ===================================================== */

function showError(text){

    errorBox.innerText=
    text;

    errorBox.style.display=
    "block";


    setTimeout(
        ()=>{
            errorBox.style.display=
            "none";
        },
        5000
    );

}


/* =====================================================
   DÉMARRAGE
   ===================================================== */

startButton.addEventListener(
"click",
async()=>{

    startButton.innerText=
    "CONNEXION...";


    /*
       1. Caméra + microphone
    */

    const mediaOK=
    await activateMedia();


    if(!mediaOK){

        startButton.innerText=
        "RÉESSAYER";

        return;

    }


    /*
       2. Reconnaissance vocale
    */

    const speechOK=
    initSpeechRecognition();


    if(!speechOK)
    return;


    /*
       3. Three.js
    */

    init3D();


    /*
       4. Animation
    */

    animate();


    /*
       5. Plein écran
    */

    try{

        if(
            document.documentElement
            .requestFullscreen
        ){

            await document
            .documentElement
            .requestFullscreen();

        }

    }
    catch(e){

        console.log(
            "Fullscreen:",
            e
        );

    }


    startScreen.classList.add(
        "hidden"
    );

});


/* =====================================================
   RESIZE
   ===================================================== */

window.addEventListener(
"resize",
()=>{

    if(
        !camera ||
        !renderer
    )
    return;


    camera.aspect=
    window.innerWidth/
    window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(

        window.innerWidth,
        window.innerHeight

    );

});


/* =====================================================
   VOIX DISPONIBLES
   ===================================================== */

if(
    "speechSynthesis"
    in window
){

    speechSynthesis
    .getVoices();

}

</script>

</body>

</html>
