<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>Manassé Matrix - Édition HUD Ultime</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020408">
<link rel="apple-touch-icon" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>


<style>

:root {
    --hud-cyan: #00f0ff;
    --hud-blue: #0077ff;
    --hud-glow: rgba(0,240,255,0.5);

    --bg-dark: #020408;
    --card-dark: rgba(5,12,24,0.9);

    --border-hud: rgba(0,240,255,0.3);

    --text-light: #f1f5f9;
    --text-muted: #64748b;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;

    font-family:
        'Plus Jakarta Sans',
        sans-serif;

    -webkit-tap-highlight-color:
        transparent;
}

html,
body {

    width: 100%;
    height: 100%;

    background:
        var(--bg-dark);

    color:
        var(--text-light);

    overflow:
        hidden;
}


/* =========================================================
   APPLICATION
========================================================= */

.app-container {

    width: 100vw;
    height: 100vh;
    height: 100dvh;

    position: relative;

    display: flex;
    flex-direction: column;
}


/* =========================================================
   AUTH
========================================================= */

.auth-screen {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

    background:
        rgba(2,4,8,0.96);

    z-index: 1000;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 20px;

    backdrop-filter:
        blur(12px);
}

.auth-card {

    width: 100%;
    max-width: 380px;

    padding: 32px 20px;

    text-align: center;

    background:
        var(--card-dark);

    border:
        1px solid var(--hud-cyan);

    border-radius:
        24px;

    box-shadow:
        0 0 40px var(--hud-glow);
}

.auth-logo {

    width: 75px;
    height: 75px;

    border-radius: 50%;

    border:
        2px solid var(--hud-cyan);

    margin-bottom: 15px;

    object-fit: cover;

    box-shadow:
        0 0 20px var(--hud-cyan);
}

.auth-title {

    color:
        var(--hud-cyan);

    font-size:
        1.5rem;

    font-weight:
        800;

    margin-bottom:
        5px;

    text-transform:
        uppercase;

    letter-spacing:
        2px;
}

.auth-subtitle {

    color:
        var(--text-muted);

    font-size:
        0.8rem;

    margin-bottom:
        20px;
}

.hud-input {

    width: 100%;

    padding:
        14px 16px;

    margin-bottom:
        15px;

    border-radius:
        12px;

    border:
        1px solid var(--border-hud);

    background:
        rgba(0,240,255,0.05);

    color:
        white;

    outline:
        none;
}

.hud-btn {

    width: 100%;

    padding:
        14px;

    border:
        none;

    border-radius:
        12px;

    background:
        linear-gradient(
            135deg,
            var(--hud-cyan),
            var(--hud-blue)
        );

    color:
        #020408;

    font-weight:
        800;

    cursor:
        pointer;
}


/* =========================================================
   INTERFACE NORMALE
========================================================= */

.main-app {

    display:
        none;

    width:
        100%;

    height:
        100%;

    flex-direction:
        column;
}

.app-header {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    padding:
        12px 16px;

    background:
        var(--card-dark);

    border-bottom:
        1px solid var(--border-hud);

    gap:
        8px;

    flex-wrap:
        wrap;
}

.app-title-container {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;
}

.app-logo-mini {

    width:
        34px;

    height:
        34px;

    border-radius:
        50%;

    border:
        1px solid var(--hud-cyan);

    box-shadow:
        0 0 10px var(--hud-cyan);
}

.app-title {

    color:
        var(--hud-cyan);

    font-weight:
        800;

    font-size:
        1rem;

    letter-spacing:
        1px;
}

.header-controls {

    display:
        flex;

    gap:
        6px;
}

.control-btn {

    color:
        var(--hud-cyan);

    background:
        rgba(0,240,255,0.1);

    border:
        1px solid var(--border-hud);

    padding:
        6px 9px;

    border-radius:
        8px;

    font-size:
        0.65rem;

    font-weight:
        700;

    cursor:
        pointer;
}

.status-badge {

    color:
        var(--hud-cyan);

    background:
        rgba(0,240,255,0.1);

    border:
        1px solid var(--border-hud);

    padding:
        5px 10px;

    border-radius:
        20px;

    font-size:
        0.7rem;
}


/* =========================================================
   CHAT
========================================================= */

.chat-container {

    flex:
        1;

    overflow-y:
        auto;

    padding:
        16px;

    display:
        flex;

    flex-direction:
        column;

    gap:
        14px;
}

.message {

    max-width:
        88%;

    padding:
        14px 16px;

    border-radius:
        16px;

    font-size:
        0.9rem;

    line-height:
        1.5;
}

.message.user {

    align-self:
        flex-end;

    background:
        linear-gradient(
            135deg,
            rgba(0,240,255,0.25),
            rgba(0,119,255,0.25)
        );

    border:
        1px solid var(--hud-cyan);
}

.message.bot {

    align-self:
        flex-start;

    background:
        var(--card-dark);

    border:
        1px solid var(--border-hud);
}

.msg-actions {

    display:
        flex;

    gap:
        8px;

    margin-top:
        8px;
}

.action-btn {

    color:
        var(--hud-cyan);

    background:
        rgba(0,240,255,0.1);

    border:
        1px solid var(--border-hud);

    padding:
        4px 10px;

    border-radius:
        6px;

    font-size:
        0.75rem;
}

.input-area {

    display:
        flex;

    gap:
        10px;

    padding:
        12px 16px;

    background:
        var(--card-dark);

    border-top:
        1px solid var(--border-hud);
}

.chat-input {

    flex:
        1;

    padding:
        12px 16px;

    border-radius:
        12px;

    border:
        1px solid var(--border-hud);

    background:
        rgba(0,240,255,0.03);

    color:
        white;

    outline:
        none;
}

.send-btn {

    border:
        none;

    border-radius:
        12px;

    padding:
        0 20px;

    background:
        var(--hud-cyan);

    color:
        #020408;

    font-weight:
        800;
}


/* =========================================================
   =========================================================
   MODE HOLOGRAPHIQUE
   =========================================================
========================================================= */

#hologramScreen {

    position:
        fixed;

    inset:
        0;

    width:
        100vw;

    height:
        100vh;

    height:
        100dvh;

    z-index:
        99999;

    display:
        none;

    overflow:
        hidden;

    background:

        radial-gradient(
            ellipse at center,
            rgba(0,240,255,0.13),
            rgba(0,20,35,0.5) 35%,
            #010307 82%
        );

    isolation:
        isolate;
}


/* ACTIVATION */

#hologramScreen.active {

    display:
        block;
}


/* =========================================================
   CANVAS 3D
========================================================= */

#holoCanvas {

    position:
        absolute;

    inset:
        0;

    width:
        100%;

    height:
        100%;

    z-index:
        2;

    display:
        block;
}


/* =========================================================
   GRILLE
========================================================= */

.holo-grid {

    position:
        absolute;

    inset:
        0;

    z-index:
        3;

    pointer-events:
        none;

    background-image:

        linear-gradient(
            rgba(0,240,255,0.035) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(0,240,255,0.035) 1px,
            transparent 1px
        );

    background-size:
        30px 30px;

    opacity:
        0.8;
}


/* =========================================================
   VIGNETTE
========================================================= */

.holo-vignette {

    position:
        absolute;

    inset:
        0;

    z-index:
        4;

    pointer-events:
        none;

    background:
        radial-gradient(
            circle,
            transparent 35%,
            rgba(0,0,0,0.72) 100%
        );
}


/* =========================================================
   SCAN
========================================================= */

.holo-scan {

    position:
        absolute;

    left:
        0;

    right:
        0;

    top:
        -5px;

    height:
        2px;

    z-index:
        6;

    pointer-events:
        none;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--hud-cyan),
            transparent
        );

    box-shadow:
        0 0 20px var(--hud-cyan);

    opacity:
        0.5;

    animation:
        holoScan 5s linear infinite;
}

@keyframes holoScan {

    from {
        transform:
            translateY(0);
    }

    to {
        transform:
            translateY(105vh);
    }
}


/* =========================================================
   TITRE
========================================================= */

.holo-header {

    position:
        absolute;

    top:
        20px;

    left:
        20px;

    right:
        20px;

    z-index:
        10;

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    pointer-events:
        none;
}

.holo-title {

    color:
        var(--hud-cyan);

    font-size:
        0.75rem;

    font-weight:
        800;

    letter-spacing:
        3px;

    text-shadow:
        0 0 15px var(--hud-cyan);
}

.holo-status {

    color:
        var(--hud-cyan);

    font-size:
        0.62rem;

    padding:
        7px 10px;

    border:
        1px solid var(--border-hud);

    border-radius:
        20px;

    background:
        rgba(0,20,30,0.55);
}


/* =========================================================
   CERCLES
========================================================= */

.holo-circle {

    position:
        absolute;

    left:
        50%;

    top:
        53%;

    transform:
        translate(-50%,-50%);

    border-radius:
        50%;

    pointer-events:
        none;

    z-index:
        1;
}

.circle-one {

    width:
        min(80vw,600px);

    height:
        min(80vw,600px);

    border:
        1px solid rgba(0,240,255,0.18);

    box-shadow:
        0 0 50px rgba(0,240,255,0.06);
}

.circle-two {

    width:
        min(65vw,480px);

    height:
        min(65vw,480px);

    border:
        1px dashed rgba(0,240,255,0.3);

    animation:
        rotateCircle 18s linear infinite;
}

.circle-three {

    width:
        min(45vw,330px);

    height:
        min(45vw,330px);

    border:
        1px solid rgba(0,119,255,0.25);

    animation:
        rotateCircleReverse 12s linear infinite;
}

@keyframes rotateCircle {

    from {
        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }

    to {
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }
}

@keyframes rotateCircleReverse {

    from {
        transform:
            translate(-50%,-50%)
            rotate(360deg);
    }

    to {
        transform:
            translate(-50%,-50%)
            rotate(0deg);
    }
}


/* =========================================================
   HUD BAS
========================================================= */

.holo-bottom {

    position:
        absolute;

    left:
        15px;

    right:
        15px;

    bottom:
        18px;

    z-index:
        20;

    display:
        flex;

    flex-direction:
        column;

    align-items:
        center;

    gap:
        10px;
}

#holoTranscript {

    max-width:
        88%;

    min-height:
        25px;

    text-align:
        center;

    color:
        white;

    font-size:
        0.75rem;

    line-height:
        1.4;

    text-shadow:
        0 0 10px var(--hud-cyan);
}

.holo-buttons {

    display:
        flex;

    gap:
        10px;
}

.holo-btn {

    padding:
        9px 15px;

    border:
        1px solid var(--hud-cyan);

    border-radius:
        10px;

    background:
        rgba(0,15,25,0.8);

    color:
        var(--hud-cyan);

    font-size:
        0.68rem;

    font-weight:
        800;

    cursor:
        pointer;

    box-shadow:
        0 0 15px rgba(0,240,255,0.15);
}

.holo-btn.active {

    background:
        var(--hud-cyan);

    color:
        #020408;

    box-shadow:
        0 0 30px var(--hud-cyan);
}


/* =========================================================
   MICROPHONE
========================================================= */

#micDot {

    display:
        inline-block;

    width:
        8px;

    height:
        8px;

    border-radius:
        50%;

    margin-right:
        5px;

    background:
        #45515b;
}

#micDot.active {

    background:
        var(--hud-cyan);

    box-shadow:
        0 0 15px var(--hud-cyan);

    animation:
        micPulse 0.8s infinite;
}

@keyframes micPulse {

    50% {

        transform:
            scale(1.5);

        opacity:
            0.4;
    }
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px) {

    .holo-title {
        font-size:
            0.58rem;

        letter-spacing:
            2px;
    }

    .holo-status {
        font-size:
            0.52rem;
    }

    .holo-bottom {
        bottom:
            12px;
    }

}

</style>
</head>


<body>


<div class="app-container">


<!-- ======================================================
     AUTHENTIFICATION
====================================================== -->

<div class="auth-screen" id="authScreen">

    <div class="auth-card">

        <img
            src="logo.png"
            class="auth-logo"
            alt="Logo"
        >

        <h1 class="auth-title">
            Manassé Matrix
        </h1>

        <p class="auth-subtitle">
            Système HUD Neural - Double Vision
        </p>

        <input
            type="password"
            id="apiKeyInput"
            class="hud-input"
            placeholder="Entrez votre clé API Groq (gsk_...)"
        >

        <button
            class="hud-btn"
            id="initBtn"
        >
            Initialiser le système
        </button>

    </div>

</div>


<!-- ======================================================
     APPLICATION NORMALE
====================================================== -->

<div
    class="main-app"
    id="mainApp"
>


<header class="app-header">

    <div class="app-title-container">

        <img
            src="logo.png"
            class="app-logo-mini"
            alt="Logo"
        >

        <span class="app-title">
            Manassé Matrix
        </span>

    </div>


    <div class="header-controls">

        <button
            class="control-btn"
            id="demoBtn"
        >
            📁 Démo Mémoire
        </button>


        <button
            class="control-btn"
            id="graphicModeBtn"
        >
            👁️ Mode 3D
        </button>

    </div>


    <span class="status-badge">
        HUD Actif
    </span>

</header>


<div
    class="chat-container"
    id="chatContainer"
>

    <div class="message bot">

        Matrice initialisée, Maître Manassé.
        Systèmes holographiques et liaisons neuronales prêts.
        Que commandez-vous ?

        <div class="msg-actions">

            <button
                class="action-btn"
                onclick="parlerTexte(this)"
            >
                🔊 Écouter
            </button>

        </div>

    </div>

</div>


<div class="input-area">

    <input
        type="text"
        id="chatInput"
        class="chat-input"
        placeholder="Commandez l'IA ici..."
    >

    <button
        class="send-btn"
        id="sendBtn"
    >
        ➤
    </button>

</div>

</div>


<!-- ======================================================
     NOUVELLE INTERFACE HOLOGRAPHIQUE
     
     ELLE EST COMPLÈTEMENT INDÉPENDANTE
     DE L'INTERFACE NORMALE.
====================================================== -->

<div id="hologramScreen">


    <canvas
        id="holoCanvas"
    ></canvas>


    <div class="holo-circle circle-one"></div>

    <div class="holo-circle circle-two"></div>

    <div class="holo-circle circle-three"></div>


    <div class="holo-grid"></div>

    <div class="holo-vignette"></div>

    <div class="holo-scan"></div>


    <div class="holo-header">

        <div class="holo-title">
            MANASSÉ MATRIX // HOLOGRAPHIC CORE
        </div>


        <div class="holo-status">

            <span id="micDot"></span>

            <span id="micStatus">
                MICROPHONE PRÊT
            </span>

        </div>

    </div>


    <div class="holo-bottom">

        <div id="holoTranscript">

            Système holographique prêt.

        </div>


        <div class="holo-buttons">

            <button
                class="holo-btn"
                id="holoMicBtn"
            >
                🎙️ MICRO
            </button>


            <button
                class="holo-btn"
                id="holoCloseBtn"
            >
                ✕ QUITTER
            </button>

        </div>

    </div>


</div>


</div>


<script>


/* ==========================================================
   RÉFÉRENCES
========================================================== */

const authScreen =
    document.getElementById(
        'authScreen'
    );

const mainApp =
    document.getElementById(
        'mainApp'
    );

const apiKeyInput =
    document.getElementById(
        'apiKeyInput'
    );

const initBtn =
    document.getElementById(
        'initBtn'
    );

const chatContainer =
    document.getElementById(
        'chatContainer'
    );

const chatInput =
    document.getElementById(
        'chatInput'
    );

const sendBtn =
    document.getElementById(
        'sendBtn'
    );

const demoBtn =
    document.getElementById(
        'demoBtn'
    );

const graphicModeBtn =
    document.getElementById(
        'graphicModeBtn'
    );


/* ==========================================================
   HOLOGRAMME
========================================================== */

const hologramScreen =
    document.getElementById(
        'hologramScreen'
    );

const holoCanvas =
    document.getElementById(
        'holoCanvas'
    );

const holoMicBtn =
    document.getElementById(
        'holoMicBtn'
    );

const holoCloseBtn =
    document.getElementById(
        'holoCloseBtn'
    );

const holoTranscript =
    document.getElementById(
        'holoTranscript'
    );

const micDot =
    document.getElementById(
        'micDot'
    );

const micStatus =
    document.getElementById(
        'micStatus'
    );


/* ==========================================================
   MÉMOIRE
========================================================== */

let conversationMemory =
    JSON.parse(
        localStorage.getItem(
            'manasse_memory'
        )
    ) || [

        {
            role:
                "system",

            content:
                "Tu es Manassé Matrix, une intelligence artificielle futuriste créée par Manassé. Réponds naturellement en français."
        }

    ];


/* ==========================================================
   HISTORIQUE
========================================================== */

function loadSavedMessages() {

    const savedChat =
        JSON.parse(
            localStorage.getItem(
                'manasse_chat_history'
            )
        ) || [];


    if (savedChat.length > 0) {

        chatContainer.innerHTML =
            '';

        savedChat.forEach(
            msg => {

                appendMessageUI(
                    msg.text,
                    msg.sender
                );

            }
        );

    }

}


function saveChatHistory() {

    const messages =
        [];


    document
        .querySelectorAll(
            '.message'
        )
        .forEach(
            el => {

                const isUser =
                    el.classList.contains(
                        'user'
                    );


                const text =
                    isUser
                    ? el.textContent
                    : el.firstChild.nodeValue.trim();


                messages.push({

                    text:
                        text,

                    sender:
                        isUser
                        ? 'user'
                        : 'bot'

                });

            }
        );


    if (messages.length > 30) {

        messages.splice(
            0,
            messages.length - 30
        );

    }


    localStorage.setItem(
        'manasse_chat_history',
        JSON.stringify(
            messages
        )
    );

}


/* ==========================================================
   MESSAGE
========================================================== */

function appendMessageUI(
    text,
    sender
) {

    const messageDiv =
        document.createElement(
            'div'
        );


    messageDiv.classList.add(
        'message',
        sender
    );


    if (sender === 'bot') {

        messageDiv.innerHTML =
            `${escapeHTML(text)}

            <div class="msg-actions">

                <button
                    class="action-btn"
                    onclick="parlerTexte(this)"
                >
                    🔊 Écouter
                </button>

            </div>`;

    } else {

        messageDiv.textContent =
            text;

    }


    chatContainer.appendChild(
        messageDiv
    );


    chatContainer.scrollTop =
        chatContainer.scrollHeight;

}


function escapeHTML(
    text
) {

    const div =
        document.createElement(
            'div'
        );

    div.textContent =
        text;

    return div.innerHTML;

}


function addMessage(
    text,
    sender
) {

    appendMessageUI(
        text,
        sender
    );

    saveChatHistory();

}


/* ==========================================================
   DÉMO MÉMOIRE
========================================================== */

demoBtn.addEventListener(
    'click',
    () => {

        const demoText =
            `[RAPPORT MÉMOIRE] : La matrice contient actuellement ${conversationMemory.length} blocs de contexte local.`;

        addMessage(
            demoText,
            'bot'
        );

        lancerVoixEtMouvements(
            demoText
        );

    }
);


/* ==========================================================
   VARIABLES THREE.JS
========================================================== */

let scene =
    null;

let camera =
    null;

let renderer =
    null;

let avatar =
    null;

let avatarGroup =
    null;

let holoInitialized =
    false;

let isSpeaking3D =
    false;

let recognition =
    null;

let isListening =
    false;

let mouthMorphs =
    [];

let clock =
    null;


/* ==========================================================
   OUVERTURE HOLOGRAMME
========================================================== */

graphicModeBtn.addEventListener(
    'click',
    ouvrirHologramme
);


async function ouvrirHologramme() {

    hologramScreen.classList.add(
        'active'
    );


    document.body.style.overflow =
        'hidden';


    if (!holoInitialized) {

        initHologramme();

        holoInitialized =
            true;

    }


    initRecognition();


    /*
       Tentative de vrai plein écran.
    */

    try {

        if (
            document.documentElement
                .requestFullscreen
        ) {

            await document.documentElement
                .requestFullscreen();

        }

    } catch(error) {

        console.log(
            'Fullscreen non disponible',
            error
        );

    }


    holoTranscript.textContent =
        "Avatar holographique en ligne. Appuyez sur MICRO.";

}


/* ==========================================================
   FERMETURE
========================================================== */

holoCloseBtn.addEventListener(
    'click',
    fermerHologramme
);


async function fermerHologramme() {

    stopRecognition();

    window.speechSynthesis.cancel();

    isSpeaking3D =
        false;


    hologramScreen.classList.remove(
        'active'
    );


    document.body.style.overflow =
        'hidden';


    try {

        if (
            document.fullscreenElement
        ) {

            await document.exitFullscreen();

        }

    } catch(error) {

        console.log(error);

    }

}


/* ==========================================================
   INITIALISATION THREE.JS
========================================================== */

function initHologramme() {

    scene =
        new THREE.Scene();


    camera =
        new THREE.PerspectiveCamera(
            35,
            window.innerWidth /
            window.innerHeight,
            0.01,
            2000
        );


    renderer =
        new THREE.WebGLRenderer({

            canvas:
                holoCanvas,

            antialias:
                true,

            alpha:
                true

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.outputEncoding =
        THREE.sRGBEncoding;


    /* Lumières */

    const ambient =
        new THREE.AmbientLight(
            0xffffff,
            1.8
        );

    scene.add(
        ambient
    );


    const cyan =
        new THREE.PointLight(
            0x00ffff,
            7,
            15
        );

    cyan.position.set(
        0,
        3,
        4
    );

    scene.add(
        cyan
    );


    const blue =
        new THREE.PointLight(
            0x0077ff,
            5,
            15
        );

    blue.position.set(
        -4,
        1,
        2
    );

    scene.add(
        blue
    );


    /* Groupe avatar */

    avatarGroup =
        new THREE.Group();


    scene.add(
        avatarGroup
    );


    /*
       ======================================================
       NOM EXACT DE TON FICHIER
       ======================================================
    */

    const avatarFile =
        "./Modèle 3D d'IA féminine futuriste.glb.txt";


    const loader =
        new THREE.GLTFLoader();


    console.log(
        "Chargement avatar :",
        avatarFile
    );


    loader.load(

        avatarFile,

        function(gltf) {

            console.log(
                "AVATAR CHARGÉ !",
                gltf
            );


            avatar =
                gltf.scene;


            avatarGroup.add(
                avatar
            );


            /*
               Recherche de la taille
               réelle du modèle.
            */

            cadrerAvatar(
                avatar
            );


            /*
               Détection des morphs
               pour la bouche.
            */

            detecterBouche(
                avatar
            );


            /*
               Apparition holographique.
            */

            avatar.scale.multiplyScalar(
                0.001
            );


            gsap.to(
                avatar.scale,
                {
                    x:
                        avatar.scale.x / 0.001,

                    y:
                        avatar.scale.y / 0.001,

                    z:
                        avatar.scale.z / 0.001,

                    duration:
                        1.3,

                    ease:
                        "power3.out"
                }
            );


            holoTranscript.textContent =
                "AVATAR HOLOGRAPHIQUE CONNECTÉ";


        },

        function(xhr) {

            if (xhr.total) {

                console.log(
                    "Avatar :",
                    Math.round(
                        xhr.loaded /
                        xhr.total *
                        100
                    ),
                    "%"
                );

            }

        },

        function(error) {

            console.error(
                "IMPOSSIBLE DE CHARGER L'AVATAR :",
                error
            );


            holoTranscript.textContent =
                "ERREUR : impossible de charger l'avatar 3D.";

        }

    );


    clock =
        new THREE.Clock();


    animationHologramme();


    window.addEventListener(
        'resize',
        resizeHologramme
    );

}


/* ==========================================================
   CADRAGE AUTOMATIQUE DE L'AVATAR
========================================================== */

function cadrerAvatar(
    object
) {

    const box =
        new THREE.Box3()
            .setFromObject(
                object
            );


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    const center =
        box.getCenter(
            new THREE.Vector3()
        );


    /*
       Centre réellement le modèle.
    */

    object.position.x =
        -center.x;

    object.position.y =
        -center.y;

    object.position.z =
        -center.z;


    /*
       Hauteur réelle.
    */

    const height =
        Math.max(
            size.y,
            0.001
        );


    /*
       Distance caméra calculée
       automatiquement.
    */

    const fov =
        camera.fov *
        Math.PI /
        180;


    let distance =
        (height / 2) /
        Math.tan(
            fov / 2
        );


    /*
       On donne un peu d'espace.
    */

    distance *=
        1.15;


    camera.position.set(
        0,
        0,
        distance
    );


    camera.lookAt(
        0,
        0,
        0
    );


    /*
       L'avatar est placé légèrement
       vers le bas pour donner une
       impression de présentation.
    */

    avatarGroup.position.y =
        -0.05;


    console.log(
        "Taille avatar :",
        size
    );


    console.log(
        "Distance caméra :",
        distance
    );

}


/* ==========================================================
   DÉTECTION DES MORPHS DE BOUCHE
========================================================== */

function detecterBouche(
    object
) {

    mouthMorphs =
        [];


    object.traverse(
        child => {

            if (
                !child.isMesh ||
                !child.morphTargetDictionary ||
                !child.morphTargetInfluences
            ) {

                return;

            }


            Object.keys(
                child.morphTargetDictionary
            )
            .forEach(
                name => {

                    const n =
                        name.toLowerCase();


                    if (

                        n.includes(
                            'mouth'
                        )

                        ||

                        n.includes(
                            'jaw'
                        )

                        ||

                        n.includes(
                            'viseme'
                        )

                        ||

                        n.includes(
                            'open'
                        )

                        ||

                        n === 'aa'

                        ||

                        n === 'ah'

                        ||

                        n === 'oh'

                        ||

                        n === 'ou'

                    ) {

                        mouthMorphs.push({

                            mesh:
                                child,

                            index:
                                child
                                .morphTargetDictionary[
                                    name
                                ],

                            name:
                                name

                        });

                    }

                }
            );

        }
    );


    console.log(
        "Morphs bouche trouvés :",
        mouthMorphs
    );

}


/* ==========================================================
   BOUCHE
========================================================== */

function animationBouche(
    time
) {

    if (
        mouthMorphs.length === 0
    ) {

        return;

    }


    const movement =
        (
            Math.sin(
                time * 21
            ) +
            Math.sin(
                time * 31
            ) +
            2
        ) / 4;


    mouthMorphs.forEach(
        morph => {

            let target =
                isSpeaking3D
                ? movement * 0.75
                : 0;


            const name =
                morph.name.toLowerCase();


            if (
                name.includes(
                    'open'
                )

                ||

                name.includes(
                    'jaw'
                )

                ||

                name.includes(
                    'aa'
                )

                ||

                name.includes(
                    'ah'
                )
            ) {

                target =
                    isSpeaking3D
                    ? movement
                    : 0;

            }


            morph.mesh
                .morphTargetInfluences[
                    morph.index
                ] = THREE.MathUtils.lerp(

                    morph.mesh
                        .morphTargetInfluences[
                            morph.index
                        ],

                    target,

                    0.35

                );

        }
    );

}


/* ==========================================================
   ANIMATION AVATAR
========================================================== */

function animationHologramme() {

    requestAnimationFrame(
        animationHologramme
    );


    if (
        !renderer ||
        !scene ||
        !camera
    ) {

        return;

    }


    const time =
        clock.getElapsedTime();


    if (avatarGroup) {


        /*
           Respiration / flottement.
        */

        avatarGroup.position.y +=
            (
                -0.05 +
                Math.sin(
                    time * 1.4
                ) * 0.015 -
                avatarGroup.position.y
            ) * 0.03;


        /*
           Mouvement naturel de tête.
        */

        if (
            isSpeaking3D
        ) {

            avatarGroup.rotation.y =
                Math.sin(
                    time * 2.8
                ) * 0.035;


            avatarGroup.rotation.x =
                Math.sin(
                    time * 2
                ) * 0.015;

        } else {

            avatarGroup.rotation.y =
                Math.sin(
                    time * 0.7
                ) * 0.015;

        }

    }


    animationBouche(
        time
    );


    renderer.render(
        scene,
        camera
    );

}


/* ==========================================================
   RESIZE
========================================================== */

function resizeHologramme() {

    if (
        !camera ||
        !renderer
    ) {

        return;

    }


    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

}


/* ==========================================================
   RECONNAISSANCE VOCALE
========================================================== */

function initRecognition() {

    if (recognition) {

        return;

    }


    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

        micStatus.textContent =
            "VOIX NON SUPPORTÉE";

        return;

    }


    recognition =
        new SpeechRecognition();


    recognition.lang =
        "fr-FR";


    recognition.continuous =
        false;


    recognition.interimResults =
        true;


    recognition.onstart =
        function() {

            isListening =
                true;


            holoMicBtn.classList.add(
                'active'
            );


            micDot.classList.add(
                'active'
            );


            micStatus.textContent =
                "ÉCOUTE...";


            holoTranscript.textContent =
                "Je vous écoute...";

        };


    recognition.onresult =
        function(event) {

            let text =
                "";


            for (
                let i = event.resultIndex;
                i < event.results.length;
                i++
            ) {

                text +=
                    event.results[i][0]
                        .transcript;

            }


            holoTranscript.textContent =
                "Vous : " + text;


            const last =
                event.results[
                    event.results.length - 1
                ];


            if (
                last.isFinal
            ) {

                const command =
                    text.trim();


                stopRecognition();


                if (
                    command
                ) {

                    traiterCommandeVocale(
                        command
                    );

                }

            }

        };


    recognition.onerror =
        function(event) {

            console.log(
                "Micro erreur :",
                event.error
            );


            stopRecognition();


            if (
                event.error ===
                "not-allowed"
            ) {

                holoTranscript.textContent =
                    "Autorisez le microphone pour utiliser le mode vocal.";

            }

        };


    recognition.onend =
        function() {

            isListening =
                false;

            holoMicBtn.classList.remove(
                'active'
            );

            micDot.classList.remove(
                'active'
            );

            micStatus.textContent =
                "MICROPHONE PRÊT";

        };

}


/* ==========================================================
   MICRO
========================================================== */

holoMicBtn.addEventListener(
    'click',
    function() {

        initRecognition();


        if (!recognition) {

            holoTranscript.textContent =
                "La reconnaissance vocale n'est pas disponible.";

            return;

        }


        if (isListening) {

            stopRecognition();

        } else {

            try {

                recognition.start();

            } catch(error) {

                console.log(error);

            }

        }

    }
);


function stopRecognition() {

    if (
        recognition &&
        isListening
    ) {

        try {

            recognition.stop();

        } catch(error) {}

    }


    isListening =
        false;


    holoMicBtn.classList.remove(
        'active'
    );


    micDot.classList.remove(
        'active'
    );


    micStatus.textContent =
        "MICROPHONE PRÊT";

}


/* ==========================================================
   COMMANDE VOCALE
========================================================== */

async function traiterCommandeVocale(
    command
) {

    addMessage(
        command,
        'user'
    );


    holoTranscript.textContent =
        "Analyse neuronale...";


    const response =
        await callGroqAPI(
            command
        );


    addMessage(
        response,
        'bot'
    );


    holoTranscript.textContent =
        response;


    lancerVoixEtMouvements(
        response
    );

}


/* ==========================================================
   GROQ
========================================================== */

async function callGroqAPI(
    userMessage
) {

    const apiKey =
        localStorage.getItem(
            'manasse_api_key'
        );


    conversationMemory.push({

        role:
            "user",

        content:
            userMessage

    });


    try {

        const response =
            await fetch(
                "https://api.groq.com/openai/v1/chat/completions",
                {

                    method:
                        "POST",

                    headers: {

                        "Authorization":
                            `Bearer ${apiKey}`,

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            model:
                                "openai/gpt-oss-120b",

                            messages:
                                conversationMemory

                        })

                }
            );


        const data =
            await response.json();


        if (data.error) {

            throw new Error(
                data.error.message
            );

        }


        const botReply =
            data.choices[0]
                .message
                .content;


        conversationMemory.push({

            role:
                "assistant",

            content:
                botReply

        });


        localStorage.setItem(

            'manasse_memory',

            JSON.stringify(
                conversationMemory
            )

        );


        return botReply;


    } catch(error) {

        console.error(
            error
        );


        return:
            "Erreur de connexion au serveur neural.";

    }

}


/* ==========================================================
   VOIX
========================================================== */

function parlerTexte(
    button
) {

    const message =
        button
            .closest('.message')
            .firstChild
            .nodeValue
            .trim();


    lancerVoixEtMouvements(
        message
    );

}


function lancerVoixEtMouvements(
    texte
) {

    if (
        !window.speechSynthesis
    ) {

        return;

    }


    window.speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            texte
        );


    utterance.lang =
        "fr-FR";


    utterance.rate =
        0.95;


    utterance.pitch =
        0.9;


    const voices =
        speechSynthesis.getVoices();


    const frenchVoice =
        voices.find(
            v =>
                v.lang
                    .toLowerCase()
                    .startsWith(
                        'fr'
                    )
        );


    if (frenchVoice) {

        utterance.voice =
            frenchVoice;

    }


    utterance.onstart =
        function() {

            isSpeaking3D =
                true;

        };


    utterance.onend =
        function() {

            isSpeaking3D =
                false;

        };


    utterance.onerror =
        function() {

            isSpeaking3D =
                false;

        };


    speechSynthesis.speak(
        utterance
    );

}


/* ==========================================================
   CHAT NORMAL
========================================================== */

async function handleSendMessage() {

    const text =
        chatInput.value.trim();


    if (!text) {

        return;

    }


    addMessage(
        text,
        'user'
    );


    chatInput.value =
        '';


    const response =
        await callGroqAPI(
            text
        );


    addMessage(
        response,
        'bot'
    );


    lancerVoixEtMouvements(
        response
    );

}


sendBtn.addEventListener(
    'click',
    handleSendMessage
);


chatInput.addEventListener(
    'keypress',
    function(e) {

        if (
            e.key === 'Enter'
        ) {

            handleSendMessage();

        }

    }
);
