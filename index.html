<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Manassé Matrix - Édition HUD Ultime</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#020408">
<link rel="apple-touch-icon" href="logo.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

<style>

:root {
    --hud-cyan:#00f0ff;
    --hud-blue:#0077ff;
    --hud-glow:rgba(0,240,255,.5);
    --bg-dark:#020408;
    --card-dark:rgba(5,12,24,.9);
    --border-hud:rgba(0,240,255,.3);
    --text-light:#f1f5f9;
    --text-muted:#64748b;
}

* {
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Plus Jakarta Sans',sans-serif;
    -webkit-tap-highlight-color:transparent;
}

html,
body {
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020408;
    color:var(--text-light);
}

.app-container {
    width:100vw;
    height:100vh;
    height:100dvh;
    position:relative;
}

.auth-screen {
    position:fixed;
    inset:0;
    z-index:1000;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(2,4,8,.96);

    backdrop-filter:blur(12px);
}

.auth-card {
    width:100%;
    max-width:380px;

    padding:32px 20px;

    text-align:center;

    background:var(--card-dark);

    border:1px solid var(--hud-cyan);
    border-radius:24px;

    box-shadow:
        0 0 40px var(--hud-glow),
        inset 0 0 20px rgba(0,240,255,.15);
}

.auth-logo {
    width:75px;
    height:75px;

    border-radius:50%;

    border:2px solid var(--hud-cyan);

    margin-bottom:15px;

    object-fit:cover;

    box-shadow:0 0 20px var(--hud-cyan);
}

.auth-title {
    color:var(--hud-cyan);
    font-size:1.5rem;
    font-weight:800;

    margin-bottom:5px;

    text-transform:uppercase;
    letter-spacing:2px;

    text-shadow:0 0 10px var(--hud-glow);
}

.auth-subtitle {
    color:var(--text-muted);
    font-size:.8rem;

    margin-bottom:20px;
}

.hud-input {
    width:100%;

    padding:14px 16px;

    margin-bottom:15px;

    background:rgba(0,240,255,.05);

    border:1px solid var(--border-hud);

    color:var(--text-light);

    border-radius:12px;

    outline:none;
}

.hud-btn {
    width:100%;

    padding:14px;

    border:0;
    border-radius:12px;

    background:linear-gradient(
        135deg,
        var(--hud-cyan),
        var(--hud-blue)
    );

    color:#020408;

    font-weight:800;

    cursor:pointer;
}

.main-app {
    display:none;

    flex-direction:column;

    width:100%;
    height:100%;
}

.app-header {
    display:flex;

    align-items:center;
    justify-content:space-between;

    padding:12px 16px;

    background:var(--card-dark);

    border-bottom:1px solid var(--border-hud);

    flex-wrap:wrap;

    gap:8px;
}

.app-title-container {
    display:flex;
    align-items:center;
    gap:10px;
}

.app-logo-mini {
    width:34px;
    height:34px;

    border-radius:50%;

    border:1px solid var(--hud-cyan);

    box-shadow:0 0 10px var(--hud-cyan);
}

.app-title {
    color:var(--hud-cyan);

    font-size:1rem;

    font-weight:800;

    letter-spacing:1px;
}

.header-controls {
    display:flex;
    gap:6px;
}

.control-btn {
    padding:6px 9px;

    border-radius:8px;

    border:1px solid var(--border-hud);

    background:rgba(0,240,255,.1);

    color:var(--hud-cyan);

    font-size:.65rem;

    font-weight:700;

    cursor:pointer;
}

.status-badge {
    padding:5px 10px;

    border-radius:20px;

    border:1px solid var(--border-hud);

    background:rgba(0,240,255,.1);

    color:var(--hud-cyan);

    font-size:.7rem;
}


/* =========================================================
   CONTENEUR HOLOGRAMME
   ========================================================= */

#hologram-view {
    display:none;

    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;
    height:100dvh;

    z-index:9999;

    overflow:hidden;

    background:
        radial-gradient(
            circle at center,
            rgba(0,45,70,.95) 0%,
            rgba(2,8,15,.98) 48%,
            #020408 100%
        );
}

#hologram-view.active {
    display:block;

    width:100vw;
    height:100vh;
    height:100dvh;
}

#hologram-view canvas {
    position:absolute;

    inset:0;

    width:100% !important;
    height:100% !important;

    display:block;
}


/* =========================================================
   HUD HOLOGRAMME
   ========================================================= */

.holo-grid {
    position:absolute;

    inset:0;

    pointer-events:none;

    background:
        linear-gradient(
            rgba(0,240,255,.035) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(0,240,255,.035) 1px,
            transparent 1px
        );

    background-size:30px 30px;

    z-index:2;
}

.holo-title {
    position:absolute;

    top:20px;
    left:20px;

    z-index:10;

    color:var(--hud-cyan);

    font-size:.8rem;

    letter-spacing:2px;

    text-shadow:0 0 12px var(--hud-cyan);
}

.holo-status {
    position:absolute;

    left:20px;
    bottom:25px;

    z-index:10;

    color:var(--hud-cyan);

    font-size:.7rem;

    letter-spacing:1px;

    text-shadow:0 0 10px var(--hud-cyan);
}

.holo-close {
    position:absolute;

    top:18px;
    right:18px;

    z-index:20;

    padding:9px 13px;

    border:1px solid rgba(0,240,255,.5);

    border-radius:10px;

    background:rgba(0,20,30,.75);

    color:var(--hud-cyan);

    font-weight:800;

    cursor:pointer;

    box-shadow:0 0 15px rgba(0,240,255,.15);
}


/* =========================================================
   CHAT
   ========================================================= */

.chat-container {
    flex:1;

    overflow-y:auto;

    padding:16px;

    display:flex;

    flex-direction:column;

    gap:14px;
}

.message {
    max-width:88%;

    padding:14px 16px;

    border-radius:16px;

    font-size:.9rem;

    line-height:1.5;
}

.message.user {
    align-self:flex-end;

    background:linear-gradient(
        135deg,
        rgba(0,240,255,.25),
        rgba(0,119,255,.25)
    );

    border:1px solid var(--hud-cyan);
}

.message.bot {
    align-self:flex-start;

    background:var(--card-dark);

    border:1px solid var(--border-hud);
}

.msg-actions {
    display:flex;
    gap:8px;
    margin-top:8px;
}

.action-btn {
    padding:4px 10px;

    border-radius:6px;

    border:1px solid var(--border-hud);

    background:rgba(0,240,255,.1);

    color:var(--hud-cyan);

    cursor:pointer;
}

.input-area {
    padding:12px 16px;

    display:flex;

    gap:10px;

    background:var(--card-dark);

    border-top:1px solid var(--border-hud);
}

.chat-input {
    flex:1;

    padding:12px 16px;

    border-radius:12px;

    border:1px solid var(--border-hud);

    background:rgba(0,240,255,.03);

    color:white;

    outline:none;
}

.send-btn {
    padding:0 20px;

    border:0;

    border-radius:12px;

    background:var(--hud-cyan);

    color:#020408;

    font-weight:800;

    cursor:pointer;
}

</style>
</head>


<body>

<div class="app-container">


<!-- =====================================================
     AUTHENTIFICATION
     ===================================================== -->

<div class="auth-screen" id="authScreen">

    <div class="auth-card">

        <img
            src="logo.png"
            class="auth-logo"
            alt="Logo"
        >

        <h1 class="auth-title">
            Manassé Matrix
        </h1>

        <p class="auth-subtitle">
            Système HUD Neural - Double Vision
        </p>

        <input
            type="password"
            id="apiKeyInput"
            class="hud-input"
            placeholder="Entrez votre clé API Groq (gsk_...)"
        >

        <button
            class="hud-btn"
            id="initBtn"
        >
            Initialiser le système
        </button>

    </div>

</div>


<!-- =====================================================
     APPLICATION
     ===================================================== -->

<div class="main-app" id="mainApp">


<header class="app-header">

    <div class="app-title-container">

        <img
            src="logo.png"
            class="app-logo-mini"
            alt="Logo"
        >

        <span class="app-title">
            Manassé Matrix
        </span>

    </div>


    <div class="header-controls">

        <button
            class="control-btn"
            id="demoBtn"
        >
            📁 Démo Mémoire
        </button>


        <button
            class="control-btn"
            id="graphicModeBtn"
        >
            👁️ Mode 3D
        </button>

    </div>


    <span class="status-badge">
        HUD Actif
    </span>

</header>


<!-- =====================================================
     ÉCRAN HOLOGRAPHIQUE
     ===================================================== -->

<div id="hologram-view">

    <div class="holo-grid"></div>

    <div class="holo-title">
        MANASSÉ MATRIX // HOLOGRAPHIC CORE
    </div>

    <button
        class="holo-close"
        id="holoClose"
    >
        ✕ SORTIR
    </button>

    <div class="holo-status" id="holoStatus">
        INITIALISATION DU NOYAU VISUEL...
    </div>

</div>


<!-- =====================================================
     CHAT
     ===================================================== -->

<div
    class="chat-container"
    id="chatContainer"
>

    <div class="message bot">

        Matrice initialisée, Maître Manassé.
        Systèmes holographiques et liaisons
        neuronales prêts. Que commandez-vous ?

        <div class="msg-actions">

            <button
                class="action-btn"
                onclick="parlerTexte(this)"
            >
                🔊 Écouter
            </button>

        </div>

    </div>

</div>


<div class="input-area">

    <input
        type="text"
        class="chat-input"
        id="chatInput"
        placeholder="Commandez l'IA ici..."
    >

    <button
        class="send-btn"
        id="sendBtn"
    >
        ➤
    </button>

</div>


</div>

</div>


<script>

/* =========================================================
   VARIABLES PRINCIPALES
   ========================================================= */

const authScreen =
    document.getElementById("authScreen");

const mainApp =
    document.getElementById("mainApp");

const apiKeyInput =
    document.getElementById("apiKeyInput");

const initBtn =
    document.getElementById("initBtn");

const chatContainer =
    document.getElementById("chatContainer");

const chatInput =
    document.getElementById("chatInput");

const sendBtn =
    document.getElementById("sendBtn");

const demoBtn =
    document.getElementById("demoBtn");

const graphicModeBtn =
    document.getElementById("graphicModeBtn");

const hologramView =
    document.getElementById("hologram-view");

const holoClose =
    document.getElementById("holoClose");

const holoStatus =
    document.getElementById("holoStatus");


/* =========================================================
   MÉMOIRE
   ========================================================= */

let conversationMemory =
    JSON.parse(
        localStorage.getItem("manasse_memory")
    ) || [

        {
            role:"system",

            content:
            "Tu es Manassé Matrix, une intelligence artificielle futuriste de pointe. Tes réponses sont précises, percutantes et élégantes."
        }

    ];


function loadSavedMessages(){

    const saved =
        JSON.parse(
            localStorage.getItem(
                "manasse_chat_history"
            )
        ) || [];

    if(saved.length){

        chatContainer.innerHTML = "";

        saved.forEach(msg => {

            appendMessageUI(
                msg.text,
                msg.sender
            );

        });

    }

}


function saveChatHistory(){

    const messages = [];

    document
        .querySelectorAll(".message")
        .forEach(el => {

            messages.push({

                text:el.innerText
                    .replace("🔊 Écouter","")
                    .trim(),

                sender:
                    el.classList.contains("user")
                    ? "user"
                    : "bot"

            });

        });

    if(messages.length > 30){

        messages.splice(
            0,
            messages.length - 30
        );

    }

    localStorage.setItem(
        "manasse_chat_history",
        JSON.stringify(messages)
    );

}


/* =========================================================
   DÉMO MÉMOIRE
   ========================================================= */

demoBtn.addEventListener(
"click",
() => {

    const text =
    `[RAPPORT MÉMOIRE] : La matrice stocke actuellement ${conversationMemory.length} blocs d'échanges neuronaux en local.`;

    addMessage(
        text,
        "bot"
    );

    lancerVoixEtMouvements(
        text
    );

});


/* =========================================================
   AVATAR
   ========================================================= */

const AVATAR_FILE =
    "./Modèle 3D d'IA féminine futuriste.glb.txt";


let scene = null;
let camera = null;
let renderer = null;
let avatar = null;

let hologramInitialized = false;
let hologramActive = false;

let clock = null;

let isSpeaking3D = false;


/* =========================================================
   MODE HOLOGRAPHIQUE
   ========================================================= */

graphicModeBtn.addEventListener(
"click",
() => {

    if(hologramActive){

        closeHologram();

    }else{

        openHologram();

    }

});


holoClose.addEventListener(
"click",
closeHologram
);


function openHologram(){

    hologramActive = true;

    hologramView.classList.add(
        "active"
    );


    /*
       On cache complètement
       l'interface principale.
    */

    const elements =
        mainApp.children;

    for(
        let i = 0;
        i < elements.length;
        i++
    ){

        if(
            elements[i] !==
            hologramView
        ){

            elements[i].style.visibility =
                "hidden";

        }

    }


    graphicModeBtn.style.background =
        "#00f0ff";

    graphicModeBtn.style.color =
        "#020408";


    if(!hologramInitialized){

        initHologram();

        hologramInitialized = true;

    }


    /*
       Passage plein écran du téléphone
    */

    if(
        document.documentElement.requestFullscreen
    ){

        document.documentElement
            .requestFullscreen()
            .catch(()=>{});

    }

}


function closeHologram(){

    hologramActive = false;

    hologramView.classList.remove(
        "active"
    );


    const elements =
        mainApp.children;

    for(
        let i = 0;
        i < elements.length;
        i++
    ){

        elements[i].style.visibility =
            "visible";

    }


    graphicModeBtn.style.background =
        "rgba(0,240,255,.1)";

    graphicModeBtn.style.color =
        "#00f0ff";


    if(
        document.fullscreenElement
    ){

        document.exitFullscreen()
            .catch(()=>{});

    }

}


/* =========================================================
   INITIALISATION THREE.JS
   ========================================================= */

function initHologram(){

    scene =
        new THREE.Scene();


    camera =
        new THREE.PerspectiveCamera(
            35,
            window.innerWidth /
            window.innerHeight,
            .01,
            1000
        );


    camera.position.set(
        0,
        1.35,
        3.4
    );


    renderer =
        new THREE.WebGLRenderer({

            antialias:true,

            alpha:true,

            powerPreference:
                "high-performance"

        });


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.outputEncoding =
        THREE.sRGBEncoding;


    hologramView.appendChild(
        renderer.domElement
    );


    /* =====================================================
       LUMIÈRES
       ===================================================== */

    scene.add(
        new THREE.AmbientLight(
            0xffffff,
            2.5
        )
    );


    const cyan =
        new THREE.PointLight(
            0x00ffff,
            6,
            20
        );

    cyan.position.set(
        0,
        3,
        4
    );

    scene.add(cyan);


    const blue =
        new THREE.PointLight(
            0x0077ff,
            5,
            15
        );

    blue.position.set(
        -3,
        1,
        2
    );

    scene.add(blue);


    const back =
        new THREE.PointLight(
            0x00ffff,
            5,
            15
        );

    back.position.set(
        0,
        2,
        -3
    );

    scene.add(back);


    /* =====================================================
       CHARGEMENT DE L'AVATAR
       ===================================================== */

    chargerAvatar();


    clock =
        new THREE.Clock();


    animateHologram();

}


/* =========================================================
   CHARGEMENT AVATAR
   ========================================================= */

async function chargerAvatar(){

    holoStatus.innerText =
        "CHARGEMENT DE L'AVATAR 3D...";


    try{

        const response =
            await fetch(
                AVATAR_FILE
            );


        if(!response.ok){

            throw new Error(
                "Fichier introuvable : " +
                AVATAR_FILE
            );

        }


        const data =
            await response.arrayBuffer();


        const loader =
            new THREE.GLTFLoader();


        loader.parse(
            data,
            "",
            gltf => {

                avatar =
                    gltf.scene;


                preparerAvatar(
                    avatar
                );


                scene.add(
                    avatar
                );


                holoStatus.innerText =
                    "● AVATAR CONNECTÉ // SYSTÈME HOLOGRAPHIQUE ACTIF";


                faireApparaitreAvatar();

            },

            error => {

                console.error(
                    error
                );

                holoStatus.innerText =
                    "⚠ ERREUR DE LECTURE DU MODÈLE 3D";

            }

        );

    }
    catch(error){

        console.error(
            error
        );

        holoStatus.innerText =
            "⚠ AVATAR INTROUVABLE : " +
            AVATAR_FILE;

    }

}


/* =========================================================
   PRÉPARATION AVATAR
   ========================================================= */

function preparerAvatar(model){

    const box =
        new THREE.Box3()
        .setFromObject(model);


    const size =
        box.getSize(
            new THREE.Vector3()
        );


    const center =
        box.getCenter(
            new THREE.Vector3()
        );


    model.position.x -=
        center.x;

    model.position.z -=
        center.z;


    const max =
        Math.max(
            size.x,
            size.y,
            size.z
        );


    if(max > 0){

        const target =
            2.8;

        const scale =
            target / max;

        model.scale.setScalar(
            scale
        );

    }


    /*
       Position de l'avatar.
    */

    model.position.y =
        -1.35;


    /*
       Apparence holographique.
    */

    model.traverse(
    object => {

        if(
            object.isMesh
        ){

            object.frustumCulled =
                false;

            if(
                object.material
            ){

                object.material.transparent =
                    true;

                object.material.opacity =
                    .96;

            }

        }

    });

}


/* =========================================================
   APPARITION
   ========================================================= */

function faireApparaitreAvatar(){

    if(!avatar)
        return;


    avatar.scale.multiplyScalar(
        .01
    );


    let progress = .01;


    const timer =
        setInterval(
        () => {

            progress += .035;


            if(avatar){

                avatar.scale.setScalar(
                    progress
                );

            }


            if(progress >= 1){

                clearInterval(
                    timer
                );

            }

        },
        20
    );

}


/* =========================================================
   ANIMATION
   ========================================================= */

function animateHologram(){

    requestAnimationFrame(
        animateHologram
    );


    if(
        !renderer ||
        !scene ||
        !camera
    ){

        return;

    }


    const t =
        clock.getElapsedTime();


    if(avatar){

        /*
           Respiration.
        */

        avatar.position.y =
            -1.35 +
            Math.sin(t * 1.4) *
            .018;


        /*
           Mouvement naturel.
        */

        avatar.rotation.y =
            Math.sin(t * .35) *
            .08;


        /*
           Quand l'IA parle :
           mouvements plus expressifs.
        */

        if(isSpeaking3D){

            avatar.position.y =
                -1.35 +
                Math.sin(t * 7) *
                .035;


            avatar.rotation.y =
                Math.sin(t * 2.2) *
                .14;


            avatar.rotation.z =
                Math.sin(t * 3) *
                .025;

        }

    }


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   RESIZE
   ========================================================= */

window.addEventListener(
"resize",
() => {

    if(
        !camera ||
        !renderer
    )
        return;


    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});


/* =========================================================
   VOIX
   ========================================================= */

function parlerTexte(button){

    const message =
        button.closest(
            ".message"
        );


    if(!message)
        return;


    const text =
        message.innerText
        .replace(
            "🔊 Écouter",
            ""
        )
        .trim();


    lancerVoixEtMouvements(
        text
    );

}


function lancerVoixEtMouvements(
    texte
){

    if(
        !("speechSynthesis" in window)
    )
        return;


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            texte
        );


    utterance.lang =
        "fr-FR";


    utterance.pitch =
        .85;


    utterance.rate =
        .95;


    const voices =
        speechSynthesis
        .getVoices();


    const french =
        voices.find(
            v =>
            v.lang &&
            v.lang
            .toLowerCase()
            .startsWith("fr")
        );


    if(french){

        utterance.voice =
            french;

    }


    utterance.onstart =
        () => {

            isSpeaking3D =
                true;

        };


    utterance.onend =
        () => {

            isSpeaking3D =
                false;

        };


    utterance.onerror =
        () => {

            isSpeaking3D =
                false;

        };


    speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   MESSAGES
   ========================================================= */

function appendMessageUI(
    text,
    sender
){

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "message " +
        sender;


    if(sender === "bot"){

        div.innerHTML =
            `${escapeHTML(text)}
            <div class="msg-actions">
                <button
                    class="action-btn"
                    onclick="parlerTexte(this)"
                >
                    🔊 Écouter
                </button>
            </div>`;

    }
    else{

        div.textContent =
            text;

    }


    chatContainer.appendChild(
        div
    );


    chatContainer.scrollTop =
        chatContainer.scrollHeight;

}


function escapeHTML(text){

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


function addMessage(
    text,
    sender
){

    appendMessageUI(
        text,
        sender
    );

    saveChatHistory();

}

/* =========================================================
   GROQ
   ========================================================= */

async function callGroqAPI(
    userMessage
){

    const apiKey =
        localStorage.getItem(
            "manasse_api_key"
        );


    conversationMemory.push({

        role:"user",

        content:userMessage

    });


    try{

        const response =
            await fetch(
                "https://api.groq.com/openai/v1/chat/completions",
                {

                    method:"POST",

                    headers:{

                        "Authorization":
                            `Bearer ${apiKey}`,

                        "Content-Type":
                            "application/json"

                    },

                    body:JSON.stringify({

                        model:
                            "openai/gpt-oss-120b",

                        messages:
                            conversationMemory

                    })

                }
            );


        const data =
            await response.json();


        if(data.error){

            throw new Error(
                data.error.message
            );

        }


        const reply =
            data.choices[0]
            .message
            .content;


        conversationMemory.push({

            role:"assistant",

            content:reply

        });


        localStorage.setItem(
            "manasse_memory",
            JSON.stringify(
                conversationMemory
            )
        );


        return reply;

    }
    catch(error){

        console.error(
            error
        );


        return "Erreur de liaison avec le serveur neural de la matrice. Vérifiez votre clé API.";

    }

}


/* =========================================================
   ENVOI MESSAGE
   ========================================================= */

async function handleSendMessage(){

    const text =
        chatInput.value.trim();


    if(!text)
        return;


    addMessage(
        text,
        "user"
    );


    chatInput.value =
        "";


    const reply =
        await callGroqAPI(
            text
        );


    addMessage(
        reply,
        "bot"
    );


    lancerVoixEtMouvements(
        reply
    );

}


sendBtn.addEventListener(
    "click",
    handleSendMessage
);


chatInput.addEventListener(
    "keypress",
    e => {

        if(
            e.key === "Enter"
        ){

            handleSendMessage();

        }

    }
);
