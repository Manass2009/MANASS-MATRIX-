<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Manassé Matrix - Édition HUD Ultime</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#020408">
    <link rel="apple-touch-icon" href="logo.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <!-- LIENS THREE.JS ET GLTFLOADER POUR LE FICHIER 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        :root {
            --hud-cyan: #00f0ff;
            --hud-blue: #0077ff;
            --hud-glow: rgba(0, 240, 255, 0.5);
            --bg-dark: #020408;
            --card-dark: rgba(5, 12, 24, 0.9);
            --border-hud: rgba(0, 240, 255, 0.3);
            --text-light: #f1f5f9;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            height: 100%;
            width: 100%;
            background-color: var(--bg-dark);
            color: var(--text-light);
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(0, 119, 255, 0.08) 0%, transparent 85%),
                linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 25px 25px, 25px 25px;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            position: relative;
        }

        /* AUTH SCREEN */
        .auth-screen {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(2, 4, 8, 0.96);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            backdrop-filter: blur(12px);
        }

        .auth-card {
            background: var(--card-dark);
            border: 1px solid var(--hud-cyan);
            border-radius: 24px;
            padding: 32px 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 0 40px var(--hud-glow), inset 0 0 20px rgba(0, 240, 255, 0.15);
            animation: pulseGlow 3s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); }
            100% { box-shadow: 0 0 45px rgba(0, 240, 255, 0.7); }
        }

        .auth-logo {
            width: 75px; height: 75px;
            border-radius: 50%;
            border: 2px solid var(--hud-cyan);
            margin-bottom: 15px;
            object-fit: cover;
            box-shadow: 0 0 20px var(--hud-cyan);
        }

        .auth-title {
            color: var(--hud-cyan);
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--hud-glow);
        }

        .auth-subtitle {
            color: var(--text-muted);
            font-size: 0.8rem;
            margin-bottom: 20px;
        }

        .hud-input {
            width: 100%;
            background: rgba(0, 240, 255, 0.05);
            border: 1px solid var(--border-hud);
            color: var(--text-light);
            padding: 14px 16px;
            border-radius: 12px;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.3s ease;
            margin-bottom: 15px;
        }

        .hud-input:focus {
            border-color: var(--hud-cyan);
            box-shadow: 0 0 15px var(--hud-glow);
            background: rgba(0, 240, 255, 0.1);
        }

        .hud-btn {
            width: 100%;
            background: linear-gradient(135deg, var(--hud-cyan), var(--hud-blue));
            color: #020408;
            font-weight: 800;
            padding: 14px;
            border-radius: 12px;
            border: none;
            font-size: 0.95rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 20px var(--hud-glow);
            transition: transform 0.2s;
        }

        .hud-btn:active { transform: scale(0.97); }

        /* MAIN APP HUD INTERFACE */
        .main-app {
            display: none;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            background: var(--card-dark);
            border-bottom: 1px solid var(--border-hud);
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.6);
        }

        .app-title-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .app-logo-mini {
            width: 34px; height: 34px;
            border-radius: 50%;
            border: 1px solid var(--hud-cyan);
            box-shadow: 0 0 10px var(--hud-cyan);
        }

        .app-title {
            font-size: 1rem;
            font-weight: 800;
            color: var(--hud-cyan);
            letter-spacing: 1px;
            text-transform: uppercase;
            text-shadow: 0 0 8px rgba(0, 240, 255, 0.4);
        }

        .status-badge {
            font-size: 0.7rem;
            color: var(--hud-cyan);
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--border-hud);
            padding: 5px 10px;
            border-radius: 20px;
            text-transform: uppercase;
            box-shadow: 0 0 8px rgba(0, 240, 255, 0.2);
        }

        /* CONTENEUR DE L'AFFICHAGE 3D (HOLOGRAMME) */
        #hologram-view {
            width: 100%;
            height: 200px;
            background: rgba(0, 10, 20, 0.5);
            border-bottom: 1px solid var(--border-hud);
            position: relative;
            overflow: hidden;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .message {
            max-width: 88%;
            padding: 14px 16px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.5;
            position: relative;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.25), rgba(0, 119, 255, 0.25));
            border: 1px solid var(--hud-cyan);
            color: var(--text-light);
            align-self: flex-end;
            border-bottom-right-radius: 3px;
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }

        .message.bot {
            background: var(--card-dark);
            border: 1px solid var(--border-hud);
            color: var(--text-light);
            align-self: flex-start;
            border-bottom-left-radius: 3px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        .msg-actions {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .action-btn {
            background: rgba(0, 240, 255, 0.1);
            border: 1px solid var(--border-hud);
            color: var(--hud-cyan);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .action-btn:active {
            background: var(--hud-cyan);
            color: #020408;
        }

        .input-area {
            padding: 12px 16px;
            background: var(--card-dark);
            border-top: 1px solid var(--border-hud);
            display: flex;
            gap: 10px;
            backdrop-filter: blur(12px);
        }

        .chat-input {
            flex: 1;
            background: rgba(0, 240, 255, 0.03);
            border: 1px solid var(--border-hud);
            color: var(--text-light);
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s;
        }

        .chat-input:focus {
            border-color: var(--hud-cyan);
            box-shadow: 0 0 12px var(--hud-glow);
        }

        .send-btn {
            background: var(--hud-cyan);
            color: #020408;
            border: none;
            padding: 0 20px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 0 15px var(--hud-glow);
            transition: transform 0.2s;
        }

        .send-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Auth Screen -->
        <div class="auth-screen" id="authScreen">
            <div class="auth-card">
                <img src="logo.png" alt="Logo" class="auth-logo" onerror="this.src='https://via.placeholder.com/80/020408/00f0ff?text=HUD'">
                <h1 class="auth-title">Manassé Matrix</h1>
                <p class="auth-subtitle">Système HUD Neural - Double Vision</p>
                
                <input type="password" id="apiKeyInput" class="hud-input" placeholder="Entrez votre clé API Groq (gsk_...)">
                <button class="hud-btn" id="initBtn">Initialiser le système</button>
            </div>
        </div>

        <!-- Main App Interface -->
        <div class="main-app" id="mainApp">
            <header class="app-header">
                <div class="app-title-container">
                    <img src="logo.png" alt="Logo" class="app-logo-mini" onerror="this.src='https://via.placeholder.com/34/020408/00f0ff?text=M'">
                    <span class="app-title">Manassé Matrix</span>
                </div>
                <span class="status-badge">HUD Actif</span>
            </header>
            
            <!-- Zone d'affichage 3D connectée au fichier exact de ton GitHub -->
            <div id="hologram-view"></div>
            
            <div class="chat-container" id="chatContainer">
                <div class="message bot">
                    Matrice initialisée, Maître Manassé. Systèmes holographiques et liaisons neuronales prêts. Que commandez-vous ?
                    <div class="msg-actions">
                        <button class="action-btn" onclick="parlerTexte(this)">🔊 Écouter</button>
                    </div>
                </div>
            </div>

            <div class="input-area">
                <input type="text" class="chat-input" id="chatInput" placeholder="Commandez l'IA ici...">
                <button class="send-btn" id="sendBtn">➤</button>
            </div>
        </div>
    </div>

    <script>
        const authScreen = document.getElementById('authScreen');
        const mainApp = document.getElementById('mainApp');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const initBtn = document.getElementById('initBtn');
        const chatContainer = document.getElementById('chatContainer');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');

        // ==========================================
        // SYSTÈME DE MÉMOIRE INTERNE (localStorage)
        // ==========================================
        let conversationMemory = JSON.parse(localStorage.getItem('manasse_memory')) || [
            { role: "system", content: "Tu es Manassé Matrix, une intelligence artificielle futuriste de pointe, style HUD holographique. Tes réponses sont précises, percutantes et élégantes." }
        ];

        // Charger l'historique visuel dans le chat au démarrage
        function loadSavedMessages() {
            const savedChat = JSON.parse(localStorage.getItem('manasse_chat_history')) || [];
            if (savedChat.length > 0) {
                chatContainer.innerHTML = ''; // Nettoyer le message d'accueil par défaut si de la mémoire existe
                savedChat.forEach(msg => {
                    appendMessageUI(msg.text, msg.sender);
                });
            }
        }

        function saveChatHistory() {
            const messages = [];
            document.querySelectorAll('.message').forEach(el => {
                const isUser = el.classList.contains('user');
                const text = isUser ? el.textContent : el.firstChild.nodeValue.trim();
                messages.push({ text, sender: isUser ? 'user' : 'bot' });
            });
            // Garder les 30 derniers messages max pour éviter de saturer la mémoire
            if (messages.length > 30) messages.splice(0, messages.length - 30);
            localStorage.setItem('manasse_chat_history', JSON.stringify(messages));
        }

        // Vérification de la clé enregistrée
        const savedKey = localStorage.getItem('manasse_api_key');
        if (savedKey) {
            apiKeyInput.value = savedKey;
            authScreen.style.display = 'none';
            mainApp.style.display = 'flex';
            loadSavedMessages();
            initHologram3D();
        }

        initBtn.addEventListener('click', () => {
            const key = apiKeyInput.value.trim();
            if (key !== "") {
                localStorage.setItem('manasse_api_key', key);
                gsap.to(authScreen, {
                    opacity: 0,
                    duration: 0.5,
                    onComplete: () => {
                        authScreen.style.display = 'none';
                        mainApp.style.display = 'flex';
                        gsap.from(mainApp, {opacity: 0, duration: 0.5});
                        loadSavedMessages();
                        initHologram3D();
                    }
                });
            } else {
                gsap.to(apiKeyInput, {x: [-10, 10, -10, 10, 0], duration: 0.4});
            }
        });

        // ==========================================
        // AFFICHAGE ET ANIMATION 3D (THREE.JS)
        // ==========================================
        let manasseMesh = null;
        let isSpeaking3D = false;

        function initHologram3D() {
            const container = document.getElementById('hologram-view');
            if (!container || container.children.length > 0) return;

            const scene = new THREE.Scene();
            const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 1.4, 2.5);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xddeeff, 1.5);
            scene.add(ambientLight);

            const frontLight = new THREE.DirectionalLight(0x00ffff, 2.5);
            frontLight.position.set(0, 2, 4);
            scene.add(frontLight);

            // Utilisation exacte de ton fichier présent sur le dépôt GitHub
            const loader = new THREE.GLTFLoader();
            loader.load(
                './Modèle 3D d\'IA féminine futuriste.glb.txt', 
                (gltf) => {
                    manasseMesh = gltf.scene;
                    scene.add(manasseMesh);
                    manasseMesh.position.set(0, 0, 0);
                    console.log("Modèle 3D chargé avec succès !");
                },
                (xhr) => { console.log((xhr.loaded / xhr.total * 100) + '% chargé'); },
                (error) => { console.error("Erreur de chargement 3D :", error); }
            );

            // Boucle d'animation (Mouvements fluides + réaction quand elle parle)
            let clock = new THREE.Clock();
            function animate() {
                requestAnimationFrame(animate);
                let elapsedTime = clock.getElapsedTime();

                if (manasseMesh) {
                    // Rotation lente de base
                    manasseMesh.rotation.y += 0.005;
                    
                    // Si l'IA parle, elle bouge plus intensément (effet vivant)
                    if (isSpeaking3D) {
                        manasseMesh.position.y = Math.sin(elapsedTime * 15) * 0.05;
                        manasseMesh.rotation.z = Math.sin(elapsedTime * 10) * 0.03;
                    } else {
                        // Lévitation calme au repos
                        manasseMesh.position.y = Math.sin(elapsedTime * 2) * 0.03;
                        manasseMesh.rotation.z = 0;
                    }
                }
                renderer.render(scene, camera);
            }
            animate();

            window.addEventListener('resize', () => {
                camera.aspect = container.clientWidth / container.clientHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(container.clientWidth, container.clientHeight);
            });
        }

        // ==========================================
        // SYNTHÈSE VOCALE ET MOUVEMENTS ASSOCIÉS
        // ==========================================
        function parlerTexte(button) {
            const messageText = button.parentElement.previousSibling.nodeValue.trim() || button.closest('.message').innerText.replace('🔊 Écouter', '').trim();
            lancerVoixEtMouvements(messageText);
        }

        function lancerVoixEtMouvements(texte) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(texte);
                utterance.lang = 'fr-FR';
                utterance.pitch = 0.8;
                utterance.rate = 1.0;
                
                const voices = window.speechSynthesis.getVoices();
                const frenchVoice = voices.find(v => v.lang.includes('fr') && (v.name.toLowerCase().includes('male') || v.name.toLowerCase().includes('paul') || v.name.toLowerCase().includes('google')));
                if (frenchVoice) utterance.voice = frenchVoice;

                // Activer l'animation de mouvement 3D pendant qu'elle parle
                utterance.onstart = () => { isSpeaking3D = true; };
                utterance.onend = () => { isSpeaking3D = false; };
                utterance.onerror = () => { isSpeaking3D = false; };

                window.speechSynthesis.speak(utterance);
            } else {
                alert("La synthèse vocale n'est pas supportée par votre navigateur.");
            }
        }

        function appendMessageUI(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            
            if (sender === 'bot') {
                messageDiv.innerHTML = `${text} <div class="msg-actions"><button class="action-btn" onclick="parlerTexte(this)">🔊 Écouter</button></div>`;
            } else {
                messageDiv.textContent = text;
            }

            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function addMessage(text, sender) {
            appendMessageUI(text, sender);
            saveChatHistory();
        }

        // ==========================================
        // COMMUNICATION AVEC L'API GROQ & MÉMOIRE
        // ==========================================
        async function callGroqAPI(userMessage) {
            const apiKey = localStorage.getItem('manasse_api_key');
            const url = "https://api.groq.com/openai/v1/chat/completions";

            // Ajout du message utilisateur dans la mémoire interne
            conversationMemory.push({ role: "user", content: userMessage });

            try {
                const response = await fetch(url, {
                    method: "POST",
                    headers: {
                        "Authorization": `Bearer ${apiKey}`,
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        model: "openai/gpt-oss-120b",
                        messages: conversationMemory
                    })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                
                const botReply = data.choices[0].message.content;
                
                // Enregistrer la réponse du bot dans la mémoire interne
                conversationMemory.push({ role: "assistant", content: botReply });
                localStorage.setItem('manasse_memory', JSON.stringify(conversationMemory));

                return botReply;
            } catch (error) {
                console.error(error);
                return "Erreur de liaison avec le serveur neural de la matrice. Vérifiez votre clé API.";
            }
        }

        async function handleSendMessage() {
            const text = chatInput.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            chatInput.value = '';

            const botReply = await callGroqAPI(text);
            addMessage(botReply, 'bot');
            
            // Faire parler et bouger l'avatar 3D automatiquement avec la réponse
            lancerVoixEtMouvements(botReply);
        }

        sendBtn.addEventListener('click', handleSendMessage);
        chatInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSendMessage();
        });

        // Enregistrement Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log(err));
            });
        }
    </script>
</body>
</html>
